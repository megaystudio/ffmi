function simplex(c,rows){const n=c.length,m=rows.length;let ns=0,na=0;
rows=rows.map(r=>{r={...r};if(r.b<0){r.a=r.a.map(v=>-v);r.b=-r.b;r.t=r.t=='<'?'>':r.t=='>'?'<':'=';r.fl=1}return r});
rows.forEach(r=>{if(r.t!='=')ns++;if(r.t!='<')na++});
const N=n+ns+na,Tb=[],bs=[],cl=[],cost=Array(N).fill(0);DU=null;let si=n,ai=n+ns;c.forEach((v,j)=>cost[j]=v);
rows.forEach(r=>{const w=Array(N+1).fill(0);r.a.forEach((v,j)=>w[j]=v);w[N]=r.b;
if(r.t=='<'){cl.push(si);w[si]=1;bs.push(si++)}else{if(r.t=='>'){cl.push(si);w[si++]=-1}else cl.push(ai);w[ai]=1;cost[ai]=1e6;bs.push(ai++)}Tb.push(w)});
for(let it=0;it<20000;it++){const z=cost.map((cj,j)=>cj-bs.reduce((s,b,i)=>s+cost[b]*Tb[i][j],0));
let e=-1,bv=-1e-9;for(let j=0;j<N;j++)if(z[j]<bv){bv=z[j];e=j;if(it>300)break}if(e<0)break;
let l=-1,mr=Infinity;for(let i=0;i<m;i++)if(Tb[i][e]>1e-9){const q=Tb[i][N]/Tb[i][e];if(q<mr-1e-12||(it>300&&Math.abs(q-mr)<=1e-12&&bs[i]<bs[l])){mr=q;l=i}}
if(l<0)return null;const p=Tb[l][e];Tb[l]=Tb[l].map(v=>v/p);
for(let i=0;i<m;i++)if(i!=l){const f=Tb[i][e];if(f)Tb[i]=Tb[i].map((v,j)=>v-f*Tb[l][j])}bs[l]=e}

const zf=cost.map((cj,j)=>cj-bs.reduce((s,b,i)=>s+cost[b]*Tb[i][j],0));DU=rows.map((r,i)=>{const y=r.t=='<'?-zf[cl[i]]:r.t=='>'?zf[cl[i]]:1e6-zf[cl[i]];return r.fl?-y:y});

function solve(pm,tg,mc){const M=S.mats,n=M.length,rows=[],E=i=>M.map((_,j)=>+(i==j));

const CLK=[['','Normal','Normal'],['panas','Kemarau / panas','Dry season / hot'],['hujan','Penghujan / lembab','Rainy season / humid'],['pancaroba','Pancaroba (peralihan)','Transition (changeable weather)']];

const CLT=[
['KC-CL1','panas','a',[`Suhu dan kelembapan tinggi menurunkan konsumsi pakan sementara kebutuhan nutrisi harian tetap. Naikkan kepadatan nutrisi (ME dan asam amino) agar asupan harian terjaga; FFMI dapat melakukannya otomatis pada target.`,`High temperature and humidity reduce feed intake while daily nutrient needs stay the same. Raise nutrient density (ME and amino acids) to keep daily intake; FFMI can do this automatically on the targets.`]],
['KC-CL2','panas','a',[`Panas metabolisme (heat increment) serat dan protein berlebih lebih tinggi daripada lemak/minyak. Batasi serat, hindari kelebihan CP, dan penuhi asam amino dengan asam amino sintetis; energi tambahan sebaiknya dari lemak/minyak.`,`Heat increment of fiber and excess protein is higher than that of fats/oils. Limit fiber, avoid excess CP, meet amino acids with synthetic amino acids; add energy preferably from fats/oils.`]],
['KC-CL3','panas','a',[`Layer: kualitas kerabang turun saat panas (panting dan konsumsi turun). Pertimbangkan Ca lebih tinggi, limestone berpartikel kasar, dan jaga rasio Ca:avP.`,`Layers: shell quality drops in heat (panting and lower intake). Consider higher Ca, coarse limestone and keep the Ca:avP ratio.`]],
['KC-CL4','panas','a',[`Elektrolit (Na, K, Cl) hilang lewat panting; pertimbangkan dukungan elektrolit, vitamin C/E di premix atau air minum sesuai rekomendasi pemasok dan dokter hewan (di luar perhitungan solver).`,`Electrolytes (Na, K, Cl) are lost through panting; consider electrolyte, vitamin C/E support in premix or drinking water per supplier and veterinarian advice (outside the solver).`]],
['KC-CL5','panas','a',[`Manajemen: berikan pakan pada jam yang lebih sejuk (pagi/malam), sediakan air minum dingin dan cukup, dan pantau konsumsi.`,`Management: feed in cooler hours (morning/night), provide enough cool drinking water, and monitor intake.`]],
['KC-CL6','panas','*',[`Lemak/minyak lebih cepat tengik pada suhu tinggi: pakai antioksidan dan simpan di tempat sejuk. Cuaca kering menambah debu dan fines; periksa kualitas pellet.`,`Fats/oils turn rancid faster at high temperature: use antioxidants and store cool. Dry weather adds dust and fines; check pellet quality.`]],
['KC-CL7','hujan','a',[`Kelembapan tinggi meningkatkan risiko jamur dan mikotoksin pada bahan (jagung, dedak, bungkil) dan pakan jadi. Kontrol kadar air bahan masuk (idealnya ≤13%), gunakan inhibitor jamur/pengikat toksin sesuai rekomendasi, dan batasi stok lama.`,`High humidity raises mold and mycotoxin risk in materials (corn, bran, meals) and finished feed. Control incoming moisture (ideally ≤13%), use mold inhibitor/toxin binder per recommendation, and limit old stock.`]],
['KC-CL8','hujan','a',[`Litter basah memicu amonia dan gangguan pencernaan. Hindari kelebihan garam/Na/K dan protein berlebih, jaga serat wajar; pertimbangkan enzim/probiotik sesuai program kesehatan.`,`Wet litter triggers ammonia and digestive problems. Avoid excess salt/Na/K and excess protein, keep fiber reasonable; consider enzymes/probiotics per health program.`]],
['KC-CL9','hujan','*',[`Produksi: bahan lebih lembap mudah menyumbat penggilingan dan membuat kadar air setelah kondisioning terlalu tinggi. Hitung steam dan kadar air di Modul 5, dan pastikan pendinginan cukup agar kadar air pellet jadi sesuai KC-PS4. Saran proses memakai asumsi kadar air bahan 14% pada kondisi ini.`,`Production: wetter materials clog grinding and push moisture after conditioning too high. Calculate steam and moisture in Module 5 and ensure enough cooling so finished pellet moisture meets KC-PS4. Process guidance assumes 14% material moisture in this condition.`]],
['KC-CL10','hujan','*',[`Penyimpanan: gudang kering dan berventilasi, FIFO, hindari kondensasi di silo, dan jaga stok pakan jadi tetap singkat.`,`Storage: dry ventilated warehouse, FIFO, avoid condensation in silos, and keep finished feed stock short.`]],
['KC-CL11','pancaroba','a',[`Fluktuasi suhu harian yang besar menaikkan stres dan kerentanan penyakit. Jaga konsistensi formula, hindari perubahan bahan mendadak, beri dukungan sesuai program kesehatan, dan pantau konsumsi.`,`Large daily temperature swings raise stress and disease susceptibility. Keep the formula consistent, avoid sudden ingredient changes, give support per health program, and monitor intake.`]],
['KC-CL12','pancaroba','*',[`Kadar air dan mutu bahan berubah saat peralihan musim: tingkatkan frekuensi cek kadar air dan mikotoksin.`,`Moisture and quality of materials change in the season transition: check moisture and mycotoxins more often.`]],
['KC-CL13','panas','q',[`Suhu air tinggi mempercepat metabolisme tetapi menurunkan oksigen terlarut (DO). Kurangi laju pemberian, beri pakan pada jam yang lebih sejuk, dan pantau DO dan amonia.`,`High water temperature speeds metabolism but lowers dissolved oxygen (DO). Reduce feeding rate, feed in cooler hours, and monitor DO and ammonia.`]],
['KC-CL14','panas','q',[`Stabilitas pakan di air dan daya cerna menjaga limbah tetap rendah: perhatikan retensi kondisioner dan binder (KC-PS3). Hindari protein berlebih yang dibuang sebagai amonia.`,`Water stability and digestibility keep waste low: mind conditioner retention and binder (KC-PS3). Avoid excess protein that is excreted as ammonia.`]],
['KC-CL15','panas','q',[`Kemarau panjang dapat menaikkan salinitas (penguapan) dan fluktuasi suhu/pH harian. Sesuaikan manajemen mineral dan pakan dengan hasil pengukuran air tambak/kolam.`,`A long dry season can raise salinity (evaporation) and daily temperature/pH swings. Adjust mineral and feed management to pond/tank water measurements.`]],
['KC-CL16','hujan','q',[`Hujan lebat menurunkan salinitas, suhu, alkalinitas dan pH secara mendadak (stres) dan nafsu makan turun. Kurangi pemberian, pantau konsumsi (anco/tempat pakan), dan pertimbangkan dukungan mineral (Ca, Mg, K) dan vitamin C sesuai rekomendasi.`,`Heavy rain suddenly lowers salinity, temperature, alkalinity and pH (stress) and appetite drops. Reduce feeding, monitor intake (feed trays), and consider mineral (Ca, Mg, K) and vitamin C support per recommendation.`]],
['KC-CL17','hujan','q',[`Air keruh dan matinya plankton menurunkan DO pada malam hari: kurangi ransum dan pastikan pakan stabil di air.`,`Turbid water and plankton die-off lower DO at night: reduce ration and make sure feed is stable in water.`]],
['KC-CL18','pancaroba','q',[`Fluktuasi suhu dan salinitas: jaga konsistensi pakan dan hindari pergantian formula/pakan mendadak.`,`Temperature and salinity fluctuations: keep feed consistent and avoid sudden formula/feed changes.`]]
];

const STK=[
['KC-ST1',`Tekanan steam menentukan <b>suhu jenuh steam</b> (lihat tabel), sedangkan <b>suhu mash</b> di kondisioner ditentukan oleh <b>jumlah steam</b> (energi) per ton pakan. Menaikkan tekanan tidak otomatis menaikkan suhu mash; yang diatur adalah laju steam (kg/t) lewat katup kontrol.`,`Steam pressure sets the <b>saturation temperature of steam</b> (see table), while the <b>mash temperature</b> in the conditioner is set by the <b>amount of steam</b> (energy) per tonne of feed. Raising pressure does not automatically raise mash temperature; what you control is steam rate (kg/t) through the control valve.`],
['KC-ST2',`Steam boiler bertekanan tinggi diturunkan lewat pressure reducing valve (PRV) ke tekanan kerja kondisioner. Ikuti spesifikasi pabrikan mesin; tekanan kerja umumnya berada pada kisaran satu hingga beberapa bar(g) (contoh 2-4) dan harus stabil.`,`High-pressure boiler steam is reduced through a pressure reducing valve (PRV) to the conditioner working pressure. Follow the machine manufacturer specification; working pressure is typically in the range of one to a few bar(g) (e.g. 2-4) and must be stable.`],
['KC-ST3',`Penurunan tekanan lewat PRV tidak mengubah entalpi sehingga steam menjadi lebih kering (sedikit superheat). Steam jenuh kering ideal untuk kondisioning: panas laten tinggi dan sedikit air bebas. Steam basah (mengandung tetesan air) menaikkan kadar air mash tanpa kenaikan suhu setara; superheat berlebih memindahkan panas kurang efisien.`,`Pressure reduction through a PRV keeps enthalpy constant so steam becomes drier (slightly superheated). Dry saturated steam is ideal for conditioning: high latent heat and little free water. Wet steam (carrying droplets) raises mash moisture without an equivalent temperature rise; excessive superheat transfers heat less efficiently.`],
['KC-ST4',`Steam basah biasanya berasal dari pipa tanpa isolasi, steam trap rusak, atau tanpa separator. Pasang separator, steam trap, dan isolasi, serta buang kondensat sebelum katup kontrol agar suhu dan kadar air mash stabil.`,`Wet steam usually comes from uninsulated pipes, failed steam traps, or no separator. Fit a separator, steam traps and insulation, and drain condensate before the control valve so mash temperature and moisture are stable.`],
['KC-ST5',`Aturan praktis hasil perhitungan: setiap +10 °C suhu mash membutuhkan sekitar 9-10 kg/t steam dan menambah ±0,7-0,9 poin kadar air (bergantung tekanan, kekeringan steam, dan kadar air awal). Gunakan kalkulator di bawah untuk kondisi Anda.`,`Rule of thumb from the calculation: each +10 °C of mash temperature needs about 9-10 kg/t of steam and adds ±0.7-0.9 moisture points (depending on pressure, steam dryness and starting moisture). Use the calculator below for your conditions.`],
['KC-ST6',`Kadar air akhir = kadar air awal + tambahan dari steam. Dari 12% dengan suhu 85 °C kadar air naik ±3-4 poin (±15-16%). Dari 14% (musim hujan) menjadi ±17-18%, melewati rentang acuan KC-PS3: pellet lembek, slip, dan risiko choking. Turunkan kadar air bahan, turunkan target suhu, atau perbaiki kualitas steam.`,`Final moisture = starting moisture + moisture added by steam. From 12% at 85 °C moisture rises ±3-4 points (±15-16%). From 14% (rainy season) it reaches ±17-18%, above the KC-PS3 reference range: soft pellets, slipping and choking risk. Lower material moisture, lower the target temperature, or improve steam quality.`],
['KC-ST7',`Suhu kondisioner terlalu rendah memberi gelatinisasi kurang (pellet rapuh); terlalu tinggi merusak nutrien/vitamin dan menambah kadar air berlebih. Pakan akuatik butuh retensi lebih lama dan binder kuat (lihat KC-MP, KC-PS3).`,`Conditioner temperature that is too low gives poor gelatinisation (fragile pellets); too high damages nutrients/vitamins and adds excess moisture. Aquatic feed needs longer retention and a strong binder (see KC-MP, KC-PS3).`],
['KC-ST8',`Pantau suhu mash keluar kondisioner (bukan hanya tekanan steam), kg steam per ton (flow meter) atau bukaan katup, dan kadar air mash sebelum/sesudah kondisioning (oven/moisture analyzer) untuk mengkalibrasi model Anda.`,`Monitor mash temperature leaving the conditioner (not just steam pressure), kg steam per tonne (flow meter) or valve opening, and mash moisture before/after conditioning (oven/moisture analyser) to calibrate your model.`],
['KC-ST9',`Kalkulator memakai efisiensi pemanfaatan steam (default 85%) untuk kehilangan panas dinding kondisioner dan uap yang terbuang. Nilai ini asumsi; kalibrasi dengan pengukuran lapangan.`,`The calculator uses a steam utilisation efficiency (default 85%) for conditioner wall heat loss and vented vapour. This value is an assumption; calibrate with field measurements.`]
];
function m5(){const q=kq.toLowerCase(),st=STK.filter(e=>!q||(e[0]+' '+e[1]+' '+e[2]).toLowerCase().includes(q)),mc=S.machines[0],hu=FS.cl=='hujan';
return`<div class="card"><h3>${T('Modul 5: Tekanan steam vs temperatur dan hubungannya dengan conditioning','Module 5: Steam pressure vs temperature and its link to conditioning')}</h3>
<p class="mu">${T('Tabel steam jenuh (tekanan absolut ≈ gauge + 1,013 bar). Sumber: tabel termodinamika uap jenuh standar. Entalpi dalam kJ/kg.','Saturated steam table (absolute pressure ≈ gauge + 1.013 bar). Source: standard saturated steam thermodynamic tables. Enthalpy in kJ/kg.')}</p>
<div class="w"><table><tr><th>${T('Tekanan bar(g)','Pressure bar(g)')}</th><th>${T('Suhu jenuh °C','Saturation temp °C')}</th><th>${T('Panas laten kJ/kg','Latent heat kJ/kg')}</th><th>${T('Entalpi uap kJ/kg','Vapour enthalpy kJ/kg')}</th></tr>${STM.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>
<div class="w"><table><tr><th>ID</th><th>${T('Pengetahuan','Knowledge')}</th></tr>${st.map(e=>`<tr><td><b>${e[0]}</b></td><td>${e[1+li()]}</td></tr>`).join('')}</table></div></div>
<div class="card"><h3>${T('Kalkulator steam dan kadar air kondisioning','Steam and conditioning moisture calculator')}</h3><p class="mu">${T('Estimasi neraca panas dan massa sederhana; bukan pengukuran. Gunakan untuk memahami hubungan tekanan, suhu, dan kadar air, lalu kalibrasi dengan data pabrik.','A simple heat and mass balance estimate; not a measurement. Use it to understand the relation between pressure, temperature and moisture, then calibrate with plant data.')}</p>
<div class="g"><div><label>${T('Mesin','Machine')}</label><select id="sM" onchange="stM()">${S.machines.map((m,i)=>`<option value="${i}">${esc(m.n)}</option>`).join('')}</select></div><div><label>${T('Spesies','Species')}</label><select id="sS" onchange="stCalc()">${GN().map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select></div>
<div><label>${T('Tekanan steam bar(g)','Steam pressure bar(g)')}</label><input id="sp" type="number" step="any" value="3" oninput="stCalc()"></div><div><label>${T('Kekeringan steam %','Steam dryness %')}</label><input id="sx" type="number" step="any" value="100" oninput="stCalc()"></div>
<div><label>${T('Suhu mash masuk °C','Mash inlet temp °C')}</label><input id="si" type="number" step="any" value="30" oninput="stCalc()"></div><div><label>${T('Suhu target kondisioner °C','Target conditioner temp °C')}</label><input id="sT" type="number" step="any" value="${+mc.cond||85}" oninput="stCalc()"></div>
<div><label>${T('Kadar air mash awal %','Initial mash moisture %')}</label><input id="sm" type="number" step="any" value="${hu?14:12}" oninput="stCalc()"></div><div><label>${T('Efisiensi pemanfaatan steam %','Steam utilisation efficiency %')}</label><input id="se" type="number" step="any" value="85" oninput="stCalc()"></div></div>
<div id="stR"></div></div>`}
function stM(){const mc=S.machines[+$('#sM').value]||S.machines[0];$('#sT').value=+mc.cond||85;stCalc()}
function stCalc(){const e=$('#stR');if(!e)return;const g=n=>+$(n).value,P=g('#sp'),Ti=g('#si'),Tt=g('#sT'),M=g('#sm')/100,E=g('#se')/100,X=Math.max(0,Math.min(1,g('#sx')/100)),mc=S.machines[+$('#sM').value]||S.machines[0],sp=+$('#sS').value,P0=SPP[sp]||SPP[0];
if(![P,Ti,Tt,M,E,X].every(isFinite)||E<=0||Tt<=Ti){e.innerHTML=`<p class="mu" style="color:var(--bd)">${T('Periksa input: suhu target harus lebih tinggi dari suhu masuk dan efisiensi > 0.','Check inputs: target temperature must exceed inlet temperature and efficiency must be > 0.')}</p>`;return}
const cp=(1-M)*1.6+M*4.19,hg=stI(P,3),hfg=stI(P,2),Ts=stI(P,1),h=hg-(1-X)*hfg,q=E*(h-4.19*Tt),calc=(dT,m)=>{const c=(1-m)*1.6+m*4.19,s=q>0?1000*c*dT/q:NaN,cd=E*s;return{s,cd,mf:(1000*m+cd)/(1000+cd)*100}},r=calc(Tt-Ti,M),r10=calc(10,M),gain=r.mf-M*100,w=[];
if(!(q>0)||!isFinite(r.s))w.push(T('Steam pada tekanan ini tidak cukup membawa panas ke suhu target.','Steam at this pressure cannot deliver heat to the target temperature.'));
if(Ts<=Tt+5)w.push(T(`Suhu jenuh steam (${Ts.toFixed(0)} °C) hampir/di bawah suhu target (${Tt} °C): tekanan terlalu rendah untuk memanaskan sampai target.`,`Steam saturation temperature (${Ts.toFixed(0)} °C) is near/below the target (${Tt} °C): pressure too low to heat to target.`));else if(Ts<Tt+20)w.push(T(`Selisih suhu steam dan target kecil (${(Ts-Tt).toFixed(0)} °C): perpindahan panas lambat, butuh retensi lebih lama.`,`Small difference between steam and target temperature (${(Ts-Tt).toFixed(0)} °C): slow heat transfer, longer retention needed.`));
if(r.mf>P0.cm[1])w.push(T(`Kadar air setelah kondisioning (${r.mf.toFixed(1)}%) di atas rentang acuan ${P0.cm[0]}-${P0.cm[1]}% (KC-PS3): kurangi kadar air bahan masuk, turunkan target suhu, atau perbaiki kualitas steam (kering).`,`Moisture after conditioning (${r.mf.toFixed(1)}%) is above the ${P0.cm[0]}-${P0.cm[1]}% reference (KC-PS3): lower incoming moisture, lower target temperature or improve steam dryness.`));else if(r.mf<P0.cm[0])w.push(T(`Kadar air setelah kondisioning (${r.mf.toFixed(1)}%) di bawah rentang acuan ${P0.cm[0]}-${P0.cm[1]}%: gelatinisasi/ikatan bisa kurang.`,`Moisture after conditioning (${r.mf.toFixed(1)}%) is below the ${P0.cm[0]}-${P0.cm[1]}% reference: gelatinisation/binding may be poor.`));
if(+mc.steam>0&&isFinite(r.s)&&Math.abs(+mc.steam-r.s)/r.s>.25)w.push(T(`Steam di data mesin (${mc.steam} kg/t) berbeda >25% dari hasil hitung (${r.s.toFixed(0)} kg/t): periksa data mesin atau efisiensi/kekeringan steam.`,`Steam in machine data (${mc.steam} kg/t) differs >25% from the calculated value (${r.s.toFixed(0)} kg/t): check machine data or steam efficiency/dryness.`));
e.innerHTML=`<div class="w"><table><tr><td>${T('Suhu jenuh steam pada tekanan ini','Steam saturation temp at this pressure')}</td><td><b>${Ts.toFixed(1)} °C</b></td></tr><tr><td>${T('Kebutuhan steam','Steam required')}</td><td><b>${isFinite(r.s)?r.s.toFixed(1):'-'} kg/t</b> (${isFinite(r.s)?(r.s/10).toFixed(1):'-'}%)</td></tr><tr><td>${T('Air yang masuk ke mash','Water added to mash')}</td><td>${isFinite(r.cd)?r.cd.toFixed(1):'-'} kg/t</td></tr><tr><td>${T('Kadar air setelah kondisioning','Moisture after conditioning')}</td><td><b>${isFinite(r.mf)?r.mf.toFixed(1):'-'}%</b> (${gain>=0?'+':''}${isFinite(gain)?gain.toFixed(1):'-'} ${T('poin','pts')}) · ${T('acuan','reference')} ${P0.cm[0]}-${P0.cm[1]}%</td></tr><tr><td>${T('Setiap +10 °C suhu mash','Each +10 °C of mash temperature')}</td><td>+${isFinite(r10.s)?r10.s.toFixed(1):'-'} kg/t ${T('steam','steam')} · +${isFinite(r10.cd)?(r10.mf-M*100).toFixed(2):'-'} ${T('poin kadar air','moisture points')}</td></tr></table></div>`+(w.length?`<ul style="color:var(--bd)">${w.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<p class="mu">${T('Hasil dalam rentang acuan.','Result is within the reference range.')}</p>`)}
const _pkc=pKC;pKC=()=>_pkc()+m4()+m5();

{id:'about',t:{id:'Tentang aplikasi',en:'About the app'},b:{
id:`<p><b>FFMI (Feed Formulation &amp; Manufacturing Intelligence)</b> adalah aplikasi satu pengguna untuk menyusun formula pakan, menaksir biaya manufaktur sebenarnya, dan menilai kelayakan produksi berdasarkan kondisi mesin dan proses di pabrik Anda, dengan dasar pengetahuan tertanam (Knowledge Centre). Ditujukan bagi senior profesional feedmill: nutrisionis/formulator, manajer produksi dan plant, QC, dan purchasing.</p>
<h4>Fitur utama</h4>
<ul><li>Formulasi biaya terendah dengan solver (program linear); 3 kandidat di Premium: biaya terendah, risiko produksi terendah, dan seimbang.</li>
<li>Penilaian kelayakan produksi: risiko kualitas pellet, choking, beban motor, dan dampak kapasitas, lengkap dengan penjelasan <i>Mengapa?</i>.</li>
<li>Biaya manufaktur sebenarnya = bahan baku + energi + steam + biaya lain mesin + biaya tetap.</li>
<li>Pilih bahan baku yang tersedia sebelum menghitung (bahan yang tidak dicentang tidak dipakai); bahan dikelompokkan menurut sumber nutrisi: Energi, Lemak &amp; minyak, Protein, Asam amino, Mineral, Premix &amp; aditif.</li>
<li>Aturan bahan lebih lengkap: total dua bahan, rasio, batas bahan tunggal, rentang min–maks (mis. jagung 40–60%), dan batas kelompok, yang dapat dibatasi per spesies.</li>
<li>Pertimbangan kondisi iklim dan cuaca (kemarau/panas, penghujan/lembab, pancaroba) dalam menghitung formula.</li>
<li>Knowledge Centre permanen: pengetahuan bahan baku, mesin dan proses, saran parameter proses per tahap (grinding, mixing, conditioning, pelleting), cek kewajaran harga, kondisi iklim dan cuaca, serta tekanan steam vs temperatur conditioning beserta kalkulatornya.</li>
<li>Spesies: broiler, layer, udang vaname, ikan nila, dan ikan lele.</li>
<li>Data master dan transaksi: bahan baku, biaya, aturan bahan, mesin &amp; proses, knowledge pribadi, batch produksi, pembelian, hasil lab.</li>
<li>Kalibrasi dari data nyata (Premium), laporan Cetak/PDF (Premium), bahasa Indonesia/English, tema terang/gelap, login.</li></ul>
<h4>Yang perlu dipahami sejak awal</h4>
<ul><li>FFMI adalah <b>alat bantu keputusan</b>. Hasilnya estimasi dari data dan parameter yang Anda masukkan. Validasi dengan ahli nutrisi dan uji produksi.</li>
<li>Nilai bahan baku bawaan hanyalah <b>contoh</b>; ganti dengan data lab dan harga aktual Anda.</li>
<li>Model risiko mesin adalah model awal yang perlu dikalibrasi dengan batch produksi Anda.</li>
<li>Knowledge Centre berisi acuan umum industri, bukan pengganti standar pabrik Anda.</li>
<li>Aplikasi <b>single user</b>: tidak ada akun ganda, kolaborasi, atau sinkronisasi cloud. Spesies babi dan ruminansia belum tersedia.</li></ul>
<h4>Alur kerja</h4>
<div class="w"><table><tr><th>Tahap</th><th>Isi</th><th>Menu</th></tr>
<tr><td>1. Data master</td><td>Bahan baku, biaya, aturan bahan, mesin dan proses, knowledge</td><td>Bahan baku, Biaya, Aturan bahan, Mesin &amp; proses, Knowledge</td></tr>
<tr><td>2. Formulasi</td><td>Pilih target, mesin, iklim, dan bahan yang tersedia; hitung kandidat; baca kelayakan dan saran proses; simpan</td><td>Formulasi</td></tr>
<tr><td>3. Transaksi</td><td>Catat pembelian, hasil lab, batch produksi aktual</td><td>Pembelian, Hasil lab, Batch produksi</td></tr>
<tr><td>4. Evaluasi</td><td>Bandingkan estimasi dengan kenyataan, kalibrasi, perbarui data master</td><td>Batch produksi, Hasil lab, Biaya, Knowledge Centre</td></tr></table></div>`,
en:`<p><b>FFMI (Feed Formulation &amp; Manufacturing Intelligence)</b> is a single-user app to build feed formulas, estimate the true manufacturing cost, and judge production feasibility based on your plant's machine and process conditions, backed by a built-in knowledge base (Knowledge Centre). It is meant for senior feedmill professionals: nutritionists/formulators, production and plant managers, QC and purchasing.</p>
<h4>Main features</h4>
<ul><li>Lowest-cost formulation with a solver (linear programming); 3 candidates in Premium: lowest cost, lowest production risk and balanced.</li>
<li>Production feasibility rating: pellet quality, choking, motor load and capacity-impact risks, with a <i>Why?</i> explanation.</li>
<li>True manufacturing cost = raw materials + energy + steam + other machine cost + fixed cost.</li>
<li>Choose the available raw materials before calculating (unticked materials are not used); materials are grouped by the nutrient source they target: Energy, Fats &amp; oils, Protein, Amino acids, Minerals, Premix &amp; additives.</li>
<li>Richer ingredient rules: combined total, ratio, single-material limit, min–max range (e.g. corn 40–60%) and group limit, which can be restricted per species.</li>
<li>Climate and weather considerations (dry/hot, rainy/humid, transition) when calculating formulas.</li>
<li>Permanent Knowledge Centre: raw material knowledge, machine and process knowledge, process parameter advice per stage (grinding, mixing, conditioning, pelleting), a price reasonableness check, climate and weather, and steam pressure vs temperature in conditioning with its calculator.</li>
<li>Species: broiler, layer, vannamei shrimp, tilapia and catfish.</li>
<li>Master and transaction data: raw materials, costs, ingredient rules, machines &amp; process, personal knowledge, production batches, purchases, lab results.</li>
<li>Calibration from real data (Premium), Print/PDF reports (Premium), Indonesian/English, light/dark theme, login.</li></ul>
<h4>Know this from the start</h4>
<ul><li>FFMI is a <b>decision-support tool</b>. Results are estimates from the data and parameters you enter. Validate with a nutritionist and production trials.</li>
<li>The built-in raw material values are only <b>samples</b>; replace them with your lab data and actual prices.</li>
<li>The machine risk model is a starting model that should be calibrated with your production batches.</li>
<li>The Knowledge Centre holds general industry references, not a replacement for your plant standards.</li>
<li><b>Single user</b>: no multiple accounts, collaboration or cloud sync. Swine and ruminant species are not available yet.</li></ul>
<h4>Workflow</h4>
<div class="w"><table><tr><th>Stage</th><th>What</th><th>Menus</th></tr>
<tr><td>1. Master data</td><td>Raw materials, costs, ingredient rules, machines and process, knowledge</td><td>Raw materials, Costs, Ingredient rules, Machines &amp; process, Knowledge</td></tr>
<tr><td>2. Formulation</td><td>Choose target, machine, climate and available materials; generate candidates; read feasibility and process advice; save</td><td>Formulation</td></tr>
<tr><td>3. Transactions</td><td>Record purchases, lab results and actual production batches</td><td>Purchases, Lab results, Production batches</td></tr>
<tr><td>4. Evaluation</td><td>Compare estimate vs reality, calibrate, update master data</td><td>Production batches, Lab results, Costs, Knowledge Centre</td></tr></table></div>`}},
