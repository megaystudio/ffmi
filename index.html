en:`<h4>Glossary</h4>
<div class="w"><table><tr><td>ME</td><td>Metabolizable energy, kcal/kg</td></tr><tr><td>CP</td><td>Crude protein, %</td></tr><tr><td>avP</td><td>Available phosphorus</td></tr><tr><td>Lys / Met</td><td>Lysine / methionine</td></tr><tr><td>Pellet score (Pel)</td><td>Relative indicator of how easily it pellets, 0-100</td></tr><tr><td>PDI</td><td>Pellet durability index</td></tr><tr><td>Fines</td><td>Fine particles/crumbs in pellets</td></tr><tr><td>GMD</td><td>Geometric mean diameter, average particle size (µm)</td></tr><tr><td>CV (homogeneity)</td><td>Coefficient of variation of the spread in a mix; smaller is more homogeneous</td></tr><tr><td>L/D</td><td>Ratio of die channel length to hole diameter</td></tr><tr><td>Conditioning retention</td><td>Time the material spends in the conditioner (seconds)</td></tr><tr><td>Choking</td><td>Blockage of the die/pellet mill</td></tr><tr><td>Motor load</td><td>Pellet mill motor load relative to its capacity (%)</td></tr><tr><td>Feasible</td><td>Producible: no High risk according to the model</td></tr><tr><td>Shadow price</td><td>Increase in formula cost if one constraint is tightened by one unit</td></tr><tr><td>Break-even</td><td>Highest price at which a material stays competitive</td></tr><tr><td>KC</td><td>Knowledge Centre; codes KC-RM (materials), KC-MP (machine/process), KC-PS (process stage)</td></tr><tr><td>bar(g)</td><td>Gauge pressure; absolute pressure ≈ gauge + 1.013 bar</td></tr><tr><td>Saturation temperature</td><td>Boiling/condensing temperature of steam at a given pressure</td></tr><tr><td>Latent heat</td><td>Energy released when steam condenses to water at the same temperature (kJ/kg)</td></tr><tr><td>Steam dryness</td><td>Fraction of dry vapour in steam; wet steam carries free water</td></tr><tr><td>DO</td><td>Dissolved oxygen in water</td></tr><tr><td>Heat increment</td><td>Heat produced by the body from digesting and metabolising feed</td></tr><tr><td>Mycotoxin</td><td>Toxin produced by mold on materials/feed</td></tr><tr><td>t/h</td><td>Tons per hour</td></tr></table></div>
<h4>Supported browsers</h4><p>Recent versions of Chrome, Edge, Firefox and Safari.</p>
<h4>Security and privacy</h4><p>Data stays on your device and is not encrypted in browser storage; protect your device with screen lock and disk encryption. Be careful with Backup (JSON) files: they hold all your formulas and prices.</p>
<h4>Limits and disclaimer</h4>
<ul><li>FFMI is a decision-support tool; results are estimates and depend on the quality of your data.</li><li>The risk formulas and retention effect are a starting model; calibrate with production data before important decisions.</li><li>The Knowledge Centre holds general industry references; reference names and figures are not verified against any specific plant standard.</li><li>Formulation decisions, feed safety and regulatory compliance remain the responsibility of the user and qualified experts. Megay Studio is not liable for losses from using results without validation.</li></ul>
<h4>Provider and contact</h4><p><b>Megay Studio</b><br>WhatsApp: <a href="https://wa.me/6281915968790" target="_blank" rel="noopener">0819 1596 8790</a><br>Email: <a href="mailto:megi.hidayatullah@gmail.com">megi.hidayatullah@gmail.com</a></p><p>Contact us for Premium access codes, usage questions or problem reports. Please include the version number and mode (see the header) for faster help.</p>`}}

let OK=0,imp=[],impSk=0;
async function docx(buf){const v=new DataView(buf),u=new Uint8Array(buf),td=new TextDecoder();let e=u.length-22;while(e>0&&v.getUint32(e,true)!=0x06054b50)e--;
let n=v.getUint16(e+10,true),p=v.getUint32(e+16,true);
for(let i=0;i<n;i++){const cm=v.getUint16(p+10,true),csz=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
if(td.decode(u.slice(p+46,p+46+nl))=='word/document.xml'){const st=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true),data=u.slice(st,st+csz);let x;
if(cm==0)x=td.decode(data);else{const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(data);w.close();x=await new Response(ds.readable).text()}
return x.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,' ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')}
p+=46+nl+xl+cl}return''}
async function impF(e){const f=e.files[0];if(!f)return;if(!prem()){e.value='';return alert(T('Impor dokumen tersedia di Premium','Document import is a Premium feature'))}
let tx='';try{tx=/\.docx$/i.test(f.name)?await docx(await f.arrayBuffer()):await f.text()}catch(x){return alert(T('Gagal membaca file','Cannot read file'))}
const al=S.mats.map(m=>m.n.split('/').map(a=>a.trim().toLowerCase()).filter(a=>a.length>=3));impSk=0;imp=[];
tx.split(/\n+/).map(a=>a.trim()).filter(a=>a.length>=40).forEach(p=>(p.length>400?p.match(/.{1,400}(\s|$)/g):[p]).forEach(c=>{const lc=c.toLowerCase(),j=al.findIndex(a=>a.some(w=>lc.includes(w)));if(j<0)impSk++;else imp.push({on:1,m:S.mats[j].n,t:c.trim(),src:f.name})}));
imp=imp.slice(0,300);render()}
function impAdd(){S.notes.push(...imp.filter(a=>a.on).map(a=>({m:a.m,t:a.t,src:a.src,conf:'Medium',st:'Draft'})));imp=[];save();render()}
function pKn(){return`<h2>Knowledge</h2><div class="card"><h3>${T('Impor dokumen sebagai sumber','Import document as source')}</h3><p class="mu">${T('Format: DOCX, TXT, MD, CSV (PDF: simpan dulu sebagai DOCX/TXT). Paragraf yang menyebut nama bahan diusulkan sebagai Draft; Anda review, lalu ubah status ke Approved agar dipakai di laporan.','Formats: DOCX, TXT, MD, CSV (PDF: convert to DOCX/TXT first). Paragraphs naming a material are proposed as Draft; review them, then set Approved to use them in reports.')}</p><input type="file" accept=".docx,.txt,.md,.csv" onchange="impF(this)">
${imp.length?`<p class="mu">${imp.length} ${T('usulan','proposals')} · ${impSk} ${T('paragraf tanpa bahan dikenali diabaikan','paragraphs without a known material skipped')}</p><div class="w"><table>${imp.map((a,i)=>`<tr><td><input type="checkbox" style="width:auto" ${a.on?'checked':''} onchange="imp[${i}].on=this.checked"></td><td><select onchange="imp[${i}].m=this.value">${MO().map(o=>`<option ${o[0]==a.m?'selected':''}>${esc(o[0])}</option>`).join('')}</select></td><td><input style="min-width:340px" value="${esc(a.t)}" onchange="imp[${i}].t=this.value"></td></tr>`).join('')}</table></div><p><button class="b" onclick="impAdd()">${T('Tambahkan terpilih sebagai Draft','Add selected as Draft')}</button> <button class="b s" onclick="imp=[];render()">${T('Batal','Cancel')}</button></p>`:''}</div>`
+tbl('notes',[['m',T('Bahan','Material'),'sel',MO],['t',T('Pengetahuan','Knowledge'),'text'],['src',T('Sumber','Source'),'text'],['conf',T('Keyakinan','Confidence'),'sel',()=>['Low','Medium','High'].map(a=>[a,a])],['st','Status','sel',()=>[['Approved','Approved'],['Draft','Draft']]]])}
function stale(){return S.mats.filter(m=>{const e=S.costs.filter(c=>c.m==m.n).sort((a,b)=>b.d>a.d?1:-1)[0];return!e||(Date.now()-new Date(e.d))/864e5>30})}
function applyP(){S.mats.forEach(m=>{const e=S.costs.filter(c=>c.m==m.n&&c.pr!=='').sort((a,b)=>b.d>a.d?1:-1)[0];if(e)m.pr=+e.pr});save();render()}
function pCost(){const st=stale();return`<h2>${T('Database biaya','Cost database')}</h2>`+tbl('costs',[['m',T('Bahan','Material'),'sel',MO],['pr','Rp/kg'],['d',T('Tanggal','Date'),'date'],['sup',T('Pemasok','Supplier'),'text']],`<p class="mu">${st.length?T('Harga >30 hari / belum ada: ','Price >30 days old / missing: ')+st.map(m=>esc(m.n)).join(', '):T('Semua harga ≤30 hari','All prices ≤30 days')}</p><button class="b s" onclick="applyP()">${T('Terapkan harga terbaru ke bahan baku','Apply latest prices to materials')}</button>`)
+`<div class="card"><h3>${T('Tarif energi','Energy rates')}</h3><div class="g"><div><label>Rp/kWh</label><input type="number" value="${S.rate.kwh}" onchange="S.rate.kwh=+this.value;save()"></div><div><label>Rp/kg steam</label><input type="number" value="${S.rate.steam}" onchange="S.rate.steam=+this.value;save()"></div></div></div><h3>${T('Biaya tetap per kg pakan (tenaga kerja, overhead, kemasan)','Fixed cost per kg feed (labor, overhead, packaging)')}</h3>`+tbl('oc',[['n',T('Item','Item'),'text'],['v','Rp/kg']])}
function pMach(){return`<h2>${T('Mesin & parameter proses','Machines & process parameters')}</h2><div class="card mu">${T('Kolom kalibrasi (Adj pel, Base load, Koef. serat/lemak, Penalti serat) mengatur model risiko. Retensi kondisioner mengubah skor pelet efektif (± koef. poin tiap 2× lipat dari acuan 30 detik, maks ±8). Sesuaikan dengan data aktual di menu Riwayat.','Calibration columns (Pel adj, Base load, fiber/fat coef, fiber penalty) tune the risk model. Conditioning retention shifts the effective pellet score (± coef points per doubling from a 30 s reference, max ±8). Adjust them using actual data from History.')}</div>`
+tbl('machines',[['n',T('Nama','Name'),'text'],['cap','t/h'],['maxFat',T('Maks lemak %','Max fat %')],['maxFib',T('Maks serat %','Max fiber %')],['minPel',T('Min skor pel','Min pel score')],['maxLoad',T('Maks load %','Max load %')],['cond',T('Kondisioner °C','Conditioner °C')],['ret',T('Retensi kondisioner (detik)','Conditioning retention (s)')],['steam','Steam kg/t'],['kwh','kWh/t'],['ld','Die L/D','text'],['proc',T('Biaya lain Rp/kg','Other Rp/kg')],['pa',T('Adj pel','Pel adj')],['kr',T('Koef. retensi (poin/2×)','Retention coef (pts/2×)')],['bl','Base load %'],['kf',T('Koef. serat','Fiber coef')],['kt',T('Koef. lemak','Fat coef')],['fp',T('Penalti serat','Fiber penalty')]],`<p class="mu">${S.machines.map(m=>esc(m.n)+': '+rp(pc(m))+'/kg '+T('biaya proses total','total process cost')).join(' · ')}</p>`)}

function render(){mig();document.documentElement.dataset.t=S?S.theme:'light';if(S)document.documentElement.style.setProperty('--ac',S.ac);
if(!OK&&MAN_ON)return $('#app').innerHTML=`<header><b>FFMI - Feed Formulation &amp; Manufacturing Intelligence</b><span>v${APP_VER} · ${modeLbl()}</span><button type="button" class="b s" onclick="MAN_ON=0;render()">${mLang()=='id'?'Kembali':'Back'}</button></header><main>${manBody()}</main>`;
if(!OK)return $('#app').innerHTML=`<form id="lg" class="card" onsubmit="return login(event)"><h2>FFMI</h2><p class="mu">Feed Formulation & Manufacturing Intelligence</p>${S?'':`<label>Bahasa / Language</label><select id="ln"><option value="id">Indonesia</option><option value="en">English</option></select><label>${T('Nama perusahaan','Company')}</label><input id="co">`}<label>User</label><input id="us" value="${S?esc(S.user):''}" required><label>Password${S?'':' (min 6)'}</label><input id="pw" type="password" required minlength="6"><p><button class="b">${S?T('Masuk','Log in'):T('Buat akun & mulai','Create account & start')}</button></p><p class="mu" id="er"></p><p class="mu"><a href="#" onclick="MAN_ON=1;render();return false">${T('Panduan','Manual')}</a> · v${APP_VER}</p></form>`;
const tabs=[['form',T('Formulasi','Formulation')],['mats',T('Bahan baku','Raw materials')],['mach',T('Mesin & proses','Machines & process')],['kc','Knowledge Centre'],['kn',T('Knowledge saya','My knowledge')],['cost',T('Biaya','Costs')],['rules',T('Aturan bahan','Ingredient rules')],['hist',T('Riwayat','History')],['batch',T('Batch produksi','Production batches')],['purch',T('Pembelian','Purchases')],['lab',T('Hasil lab','Lab results')],['man',T('Panduan','Manual')],['set',T('Pengaturan','Settings')]];
const bodies={form:pForm,mats:()=>`<h2>${T('Database bahan baku','Raw material database')}</h2><p class="mu">${T('Nilai contoh; verifikasi dengan hasil lab Anda. Pel = skor pelletability 0-100.','Sample values; verify with your lab data. Pel = pelletability score 0-100.')}</p>${kcMatWarn()}`+tbl('mats',[['n',T('Bahan','Material'),'text'],['me','ME'],['cp','CP'],['fat',T('Lemak','Fat')],['fib',T('Serat','Fiber')],['ca','Ca'],['ap','avP'],['lys','Lys'],['met','Met'],['pr','Rp/kg'],['mn','Min %'],['mx','Max %'],['pel','Pel']]),
mach:()=>`<h2>${T('Mesin & proses','Machines & process')}</h2>`+tbl('machines',[['n',T('Nama','Name'),'text'],['cap','t/h'],['maxFat',T('Maks lemak %','Max fat %')],['maxFib',T('Maks serat %','Max fiber %')],['minPel',T('Min skor pel','Min pel score')],['maxLoad',T('Maks motor load %','Max motor load %')],['proc',T('Biaya proses Rp/kg','Process cost Rp/kg')]]),
kn:()=>`<h2>Knowledge</h2>`+`<div class="card mu">${T('Catatan pakar per bahan; tampil di laporan formula bila bahan dipakai.','Expert notes per material; shown in the report when the material is used.')}</div>`+tbl('notes',[['m',T('Bahan','Material'),'text'],['t',T('Pengetahuan','Knowledge'),'text'],['src',T('Sumber','Source'),'text'],['conf',T('Keyakinan','Confidence'),'text']]),hist:pHist,set:pSet};
Object.assign(bodies,{man:manBody,mats:pMats,kc:pKC,purch:pPurch,lab:pLab,batch:pBatch,kn:pKn,mach:pMach,cost:pCost,rules:pRules});
$('#app').innerHTML=`<header><b>FFMI - Feed Formulation &amp; Manufacturing Intelligence</b><span>${esc(S.co)} · ${esc(S.user)}</span><span>v${APP_VER} · ${modeLbl()} · ${prem()?'Premium':'Demo'}</span></header>${prem()?'':`<div class="ban">${PREM_OK?T('Mode Demo (fitur terbatas). Masukkan kode akses di Pengaturan untuk Premium.','Demo mode (limited). Enter an access code in Settings for Premium.'):T('Mode Demo ('+where()+', fitur terbatas). Premium hanya di file unduhan offline - lihat Pengaturan.','Demo mode ('+where()+', limited). Premium only in the downloaded offline file - see Settings.')}</div>`}<nav>${tabs.map(t=>`<button class="${page==t[0]?'on':''}" onclick="page='${t[0]}';render()">${t[1]}</button>`).join('')}</nav><main>${bodies[page]()}</main>`;
if(page=='form')restoreF();else if(page=='kc')stCalc()}
async function login(e){e.preventDefault();const u=$('#us').value.trim(),p=$('#pw').value;
if(!S){const s=Math.random().toString(36).slice(2);init(u,{h:await hp(p,s),s},$('#co').value||'Feedmill');S.lang=$('#ln').value;save();OK=1;return render(),false}
if(u==S.user&&await hp(p,S.s)==S.h){OK=1;page='form';res=null;msg='';render()}else $('#er').textContent=T('User atau password salah','Wrong user or password');return false}
render();
// Web base: offline cache (PWA) + minta penyimpanan permanen agar data tidak mudah terhapus browser
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
</script></body></html>
