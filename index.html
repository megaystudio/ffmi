{id:'install',t:{id:'Download dan install',en:'Download and install'},b:{
id:`<h4>A. Unduh versi offline (diperlukan untuk Premium)</h4>
<ol><li>Buka <b>Pengaturan</b> lalu tekan <b>Unduh versi offline (ZIP)</b> di kotak Lisensi.</li><li>Ekstrak ZIP. Isinya <code>FFMI.html</code> dan <code>BACA-DULU.txt</code>.</li><li>Salin <code>FFMI.html</code> ke folder tetap di komputer (mis. Dokumen\\FFMI), flashdisk, atau HP/tablet.</li><li>Klik dua kali file itu, atau klik kanan lalu <i>Open with</i> dan pilih browser (Chrome, Edge, Firefox, Safari). Tanpa instalasi dan tanpa internet. Buat bookmark atau shortcut agar mudah dibuka.</li></ol>
<p><b>Penting:</b> selalu buka dari lokasi file yang sama dan browser yang sama. Pada beberapa browser (mis. Firefox), memindahkan atau mengganti nama file/folder membuat browser menganggapnya aplikasi baru dengan data kosong. Flashdisk hanya membawa aplikasinya; data tersimpan di browser komputer yang dipakai.</p>
<p><b>HP/tablet:</b> pindahkan file lewat kabel USB, flashdisk OTG, atau Google Drive, lalu buka dari aplikasi File dengan <i>Buka dengan</i> Chrome (Android) atau Safari (iOS). Jika tidak bisa dibuka dari aplikasi pesan, simpan dulu ke folder Download. Pakai layar landscape. Cara membuka file lokal dapat berbeda antar perangkat: uji di perangkat target sebelum dipakai di lapangan.</p>
<h4>B. Install sebagai aplikasi (hanya Demo)</h4>
<ul><li><b>Chrome/Edge komputer:</b> ikon install di ujung kolom alamat, atau menu <i>Install app</i>.</li><li><b>Android (Chrome):</b> menu ⋮ lalu <i>Install app</i> / <i>Tambahkan ke layar utama</i>.</li><li><b>iPhone/iPad (Safari):</b> tombol Bagikan lalu <i>Tambah ke Layar Utama</i>.</li></ul>
<p>Aplikasi terinstal bisa dibuka offline, tetapi tetap berstatus <b>Demo</b>. Untuk Premium gunakan file unduhan (A).</p>
<h4>Persyaratan</h4><p>Browser modern versi terbaru dengan JavaScript aktif. Layar tablet ke atas disarankan untuk input tabel; HP sebaiknya landscape.</p>`,
en:`<h4>A. Download the offline version (required for Premium)</h4>
<ol><li>Open <b>Settings</b> and press <b>Download offline version (ZIP)</b> in the License box.</li><li>Extract the ZIP. It contains <code>FFMI.html</code> and <code>BACA-DULU.txt</code>.</li><li>Copy <code>FFMI.html</code> to a fixed folder on your computer (e.g. Documents\\FFMI), a flash drive, or a phone/tablet.</li><li>Double-click the file, or right-click and <i>Open with</i> a browser (Chrome, Edge, Firefox, Safari). No installation and no internet. Make a bookmark or shortcut for easy access.</li></ol>
<p><b>Important:</b> always open from the same file location and the same browser. In some browsers (e.g. Firefox), moving or renaming the file/folder makes the browser treat it as a new app with empty data. A flash drive only carries the app; your data lives in the browser of the computer you use.</p>
<p><b>Phone/tablet:</b> move the file via USB cable, OTG flash drive or Google Drive, then open it from the Files app with <i>Open with</i> Chrome (Android) or Safari (iOS). If it will not open from a messaging app, save it to the Downloads folder first. Use landscape. How local files open differs by device: test on your target device before field use.</p>
<h4>B. Install as an app (Demo only)</h4>
<ul><li><b>Desktop Chrome/Edge:</b> install icon at the end of the address bar, or menu <i>Install app</i>.</li><li><b>Android (Chrome):</b> ⋮ menu, then <i>Install app</i> / <i>Add to Home screen</i>.</li><li><b>iPhone/iPad (Safari):</b> Share button, then <i>Add to Home Screen</i>.</li></ul>
<p>The installed app works offline but stays in <b>Demo</b> mode. Use the downloaded file (A) for Premium.</p>
<h4>Requirements</h4><p>A recent modern browser with JavaScript enabled. A tablet-size screen or larger is recommended for table input; phones are best in landscape.</p>`}},

{id:'setup',t:{id:'Setting dan penggunaan awal',en:'Setup and first use'},b:{
id:`<h4>Membuat akun dan login</h4>
<ol><li>Saat pertama dibuka, pilih <b>Bahasa</b>, isi <b>Nama perusahaan</b> (tampil di header dan laporan), <b>User</b>, dan <b>Password</b> (minimal 6 karakter), lalu tekan <i>Buat akun &amp; mulai</i>. Aplikasi terbuka di mode Demo.</li><li>Berikutnya cukup isi User dan Password lalu <i>Masuk</i>. Password disimpan sebagai hash, bukan teks asli.</li><li>Ganti password dan keluar: <b>Pengaturan, Data &amp; keamanan</b>.</li></ol>
<p><b>Lupa password:</b> tidak ada fitur reset. Backup pun membawa password lama. Pilihan terakhir adalah menghapus data situs browser dan memulai dari awal; <b>seluruh data lokal hilang</b>, termasuk aktivasi Premium (hubungi Megay Studio untuk aktivasi ulang). Simpan password di tempat aman.</p>
<h4>Mengenal tampilan</h4>
<p>Header menampilkan nama lengkap aplikasi (FFMI - Feed Formulation &amp; Manufacturing Intelligence), perusahaan, user, serta versi, mode, dan lisensi. Banner kuning muncul di mode Demo. Menu tab: Formulasi, Bahan baku, Mesin &amp; proses, Knowledge Centre, Knowledge saya, Biaya, Aturan bahan, Riwayat, Batch produksi, Pembelian, Hasil lab, Panduan, Pengaturan. Perubahan pada tabel tersimpan otomatis.</p>
<h4>Pengaturan</h4>
<div class="w"><table><tr><th>Pengaturan</th><th>Fungsi</th></tr>
<tr><td>Bahasa</td><td>Indonesia atau English; berlaku untuk menu, hasil, dan laporan.</td></tr>
<tr><td>Tema, Warna utama</td><td>Terang/gelap; warna aksen header dan judul laporan.</td></tr>
<tr><td>Nama perusahaan</td><td>Tampil di header dan laporan cetak.</td></tr>
<tr><td>Lisensi</td><td>Status Demo/Premium. Kode akses hanya bisa dimasukkan di file unduhan: format <code>FFMI-XXXX-XXXX-XXXX</code>, tekan <i>Aktifkan</i>.</td></tr>
<tr><td>Backup / Restore data</td><td>Unduh seluruh data ke satu file JSON / muat kembali (Premium).</td></tr>
<tr><td>Ganti password / Keluar</td><td>Keamanan akun.</td></tr></table></div>
<h4>Personalisasi data kerja</h4>
<ul><li>Sesuaikan database <b>Bahan baku</b> dengan bahan dan nilai nutrisi pabrik Anda.</li><li>Atur <b>Mesin &amp; proses</b> sesuai line Anda; buat mesin terpisah untuk tiap line atau jenis pakan (terutama udang/ikan).</li><li>Tambahkan <b>Aturan bahan</b> sesuai kebijakan formulasi Anda, dan simpan pengalaman di <b>Knowledge saya</b>.</li><li>Target nutrisi di halaman Formulasi bisa diubah untuk perhitungan saat itu; memilih ulang preset mengembalikan nilai bawaan preset.</li><li>Pengguna Premium: lakukan <b>Backup</b> pertama setelah data awal selesai diisi.</li></ul>`,
en:`<h4>Create an account and log in</h4>
<ol><li>On first open choose the <b>Language</b>, enter <b>Company</b> (shown in the header and reports), <b>User</b> and <b>Password</b> (minimum 6 characters), then press <i>Create account &amp; start</i>. The app opens in Demo mode.</li><li>Afterwards just enter User and Password and press <i>Log in</i>. The password is stored as a hash, not as plain text.</li><li>Change password and log out: <b>Settings, Data &amp; security</b>.</li></ol>
<p><b>Forgot password:</b> there is no reset. A backup carries the old password too. The last resort is clearing the browser's site data and starting over; <b>all local data is lost</b>, including Premium activation (contact Megay Studio for re-activation). Keep your password somewhere safe.</p>
<h4>Know the screen</h4>
<p>The header shows the full app name (FFMI - Feed Formulation &amp; Manufacturing Intelligence), company, user, plus version, mode and license. A yellow banner appears in Demo mode. Tab menus: Formulation, Raw materials, Machines &amp; process, Knowledge Centre, My knowledge, Costs, Ingredient rules, History, Production batches, Purchases, Lab results, Manual, Settings. Table edits are saved automatically.</p>
<h4>Settings</h4>
<div class="w"><table><tr><th>Setting</th><th>Function</th></tr>
<tr><td>Language</td><td>Indonesian or English; applies to menus, results and reports.</td></tr>
<tr><td>Theme, Accent</td><td>Light/dark; accent colour of header and report titles.</td></tr>
<tr><td>Company</td><td>Shown in the header and printed reports.</td></tr>
<tr><td>License</td><td>Demo/Premium status. The access code can only be entered in the downloaded file: format <code>FFMI-XXXX-XXXX-XXXX</code>, press <i>Activate</i>.</td></tr>
<tr><td>Backup / Restore data</td><td>Download all data to one JSON file / load it back (Premium).</td></tr>
<tr><td>Change password / Log out</td><td>Account security.</td></tr></table></div>
<h4>Personalise your working data</h4>
<ul><li>Adapt the <b>Raw materials</b> database to your plant's materials and nutrient values.</li><li>Set up <b>Machines &amp; process</b> for your lines; create separate machines per line or feed type (especially shrimp/fish).</li><li>Add <b>Ingredient rules</b> per your formulation policy and store experience in <b>My knowledge</b>.</li><li>Nutrition targets on the Formulation page can be edited for the current calculation; re-selecting a preset restores its defaults.</li><li>Premium users: make the first <b>Backup</b> once the initial data is entered.</li></ul>`}},

{id:'data',t:{id:'Data master dan transaksi',en:'Master and transaction data'},b:{
id:`<p>Data master (acuan yang jarang berubah) menentukan kualitas hasil formula, jadi isi lebih dulu dengan benar. Klik sel tabel lalu ketik untuk mengubah (tersimpan otomatis); <b>+ Tambah</b> menambah baris, <b>×</b> menghapus (ada konfirmasi). Di Demo, penambahan baris dibatasi.</p>
<h4>Bahan baku</h4>
<p>Bawaan: 17 bahan contoh (jagung, dedak padi, SBM 46, MBM, wheat pollard, minyak sawit, limestone, DCP, DL-Met, L-Lys HCl, garam, premix, bentonite, tepung ikan 60, tepung terigu, CGM 60, minyak ikan).</p>
<div class="w"><table><tr><th>Kolom</th><th>Arti</th></tr>
<tr><td>Kelompok</td><td>Kelompok sumber nutrisi (lihat di bawah).</td></tr>
<tr><td>Bahan</td><td>Nama bahan; menjadi kunci pencocokan Knowledge Centre dan aturan bahan.</td></tr>
<tr><td>ME</td><td>Energi metabolis, kcal/kg (nilai unggas; tidak jadi target di preset udang/ikan).</td></tr>
<tr><td>CP, Lemak, Serat</td><td>Protein kasar, lemak, serat kasar (%).</td></tr>
<tr><td>Ca, avP, Lys, Met</td><td>Kalsium, fosfor tersedia, lisin, metionin (%).</td></tr>
<tr><td>Rp/kg</td><td>Harga yang dipakai solver; perbarui lewat menu Biaya/Pembelian.</td></tr>
<tr><td>Min %, Max %</td><td>Batas inklusi bahan dalam formula (premix bawaan dikunci 0,3%).</td></tr>
<tr><td>Pel</td><td>Skor pelletability bahan 0-100; skor formula = rata-rata tertimbang. Makin tinggi makin mudah dipelet.</td></tr></table></div>
<p class="mu">Jika nilai bahan di luar rentang tipikal Knowledge Centre, muncul kotak peringatan kuning. Itu bukan error; cek dengan hasil lab.</p>
<p><b>Kelompok sumber nutrisi.</b> Tabel dikelompokkan menurut nutrisi yang ditargetkan: <b>Energi</b> (jagung, dedak, pollard, terigu), <b>Lemak &amp; minyak</b>, <b>Protein</b> (SBM, MBM, tepung ikan, CGM), <b>Asam amino</b> (DL-Met, L-Lys), <b>Mineral</b> (limestone, DCP, garam), <b>Premix &amp; aditif</b> (premix, bentonite), dan <b>Lainnya</b>. Bahan dikenali otomatis dari namanya; ubah kolom Kelompok bila perlu. Kelompok dipakai untuk pilihan bahan di halaman Formulasi, aturan bahan tipe Kelompok, dan ringkasan komposisi per kelompok di hasil dan laporan.</p>
<h4>Biaya</h4>
<ul><li><b>Harga bahan baku (riwayat):</b> catat harga per tanggal dan pemasok. Bahan dengan harga &gt;30 hari atau belum ada ditandai. Tombol <i>Terapkan harga terbaru ke bahan baku</i> memindahkan harga terbaru ke kolom Rp/kg.</li><li><b>Tarif energi:</b> Rp/kWh dan Rp/kg steam.</li><li><b>Biaya tetap per kg pakan:</b> tenaga kerja, overhead, kemasan, dll.</li></ul>
<p>Biaya manufaktur sebenarnya (Rp/kg) = bahan baku + (kWh/t × tarif listrik ÷ 1.000) + (steam kg/t × tarif steam ÷ 1.000) + biaya lain mesin + jumlah biaya tetap.</p>
<h4>Aturan bahan</h4>
<p>Aturan dipakai solver sebagai batasan keras. Pilih <b>Tipe</b> lebih dulu (pilihan A dan B menyesuaikan tipe), lalu bahan atau kelompok A (dan B bila perlu), nilai v (pada tipe min–maks, kolom <b>v / Min %</b> adalah batas bawah dan kolom <b>Maks %</b> adalah batas atas), spesies yang dituju, status On/Off, serta alasan/sumber.</p><div class="w"><table><tr><th>Tipe</th><th>Arti</th><th>Contoh</th></tr><tr><td>A+B ≤ v% / ≥ v%</td><td>Total dua bahan</td><td>dedak + pollard ≤ 25%</td></tr><tr><td>A ≤ v×B / ≥ v×B</td><td>Rasio dua bahan</td><td>jagung ≤ 2,2 × SBM</td></tr><tr><td>A ≤ v% / ≥ v% (bahan tunggal)</td><td>Batas atau minimum satu bahan; B tidak dipakai</td><td>tepung ikan ≤ 8%</td></tr><tr><td>A min–maks % (bahan tunggal)</td><td>Rentang pemakaian satu bahan: batas bawah dan batas atas dalam satu aturan; B tidak dipakai</td><td>Jagung 40% sampai 60%</td></tr><tr><td>Kelompok A ≤ v% / ≥ v%</td><td>Total satu kelompok sumber nutrisi</td><td>kelompok Protein ≤ 40%; kelompok Mineral ≥ 3%</td></tr><tr><td>Kelompok A min–maks %</td><td>Rentang total satu kelompok</td><td>kelompok Protein 25% sampai 35%</td></tr></table></div><p>Kolom <b>Berlaku untuk</b> membatasi aturan pada satu spesies (Semua, Broiler, Layer, Udang, atau Ikan), sehingga batas yang berbeda per spesies dicatat sebagai aturan terpisah. Aturan di luar spesies yang sedang dihitung tidak dipakai dan tidak muncul di hasil. Aturan yang terlalu ketat bisa membuat formula tanpa solusi; gunakan Off untuk menguji. Aturan contoh bawaan: Limestone + DCP ≤ 14%. Di Demo maksimal 2 aturan; satu aturan min–maks hanya memakai satu baris.</p><p><b>Membatasi pemakaian bahan dengan rentang min–maks</b> (mis. jagung minimal 40% dan maksimal 60%):</p><ol><li>Buka tab <b>Aturan bahan</b>, lalu tekan <b>+ Tambah</b>.</li><li>Pada <b>Tipe</b> pilih <i>A min–maks % (bahan tunggal)</i>. Untuk membatasi total satu kelompok, pilih <i>Kelompok A min–maks %</i>.</li><li>Pilih bahan pada kolom <b>A</b> (kolom B tidak dipakai).</li><li>Isi <b>v / Min %</b> dengan batas bawah dan <b>Maks %</b> dengan batas atas.</li><li>Pilih <b>Berlaku untuk</b> (Semua atau satu spesies), pastikan status <b>On</b>, lalu isi alasan/sumber.</li><li>Ulangi untuk bahan lain, lalu jalankan <b>Hitung formula</b> di menu Formulasi.</li></ol><div class="w"><table><tr><th>Tipe</th><th>A</th><th>v / Min %</th><th>Maks %</th><th>Arti</th></tr><tr><td>A min–maks %</td><td>Jagung / Corn</td><td>40</td><td>60</td><td>40% ≤ Jagung ≤ 60%</td></tr><tr><td>A min–maks %</td><td>SBM 46</td><td>20</td><td>30</td><td>20% ≤ SBM 46 ≤ 30%</td></tr></table></div><ul><li>Batas bawah dan batas atas dipakai solver sebagai dua batasan keras sekaligus. Solver tetap memilih biaya terendah di dalam rentang, sehingga hasil sering berada tepat di batas bawah atau batas atas.</li><li>Batas <b>Min %</b> dan <b>Max %</b> di menu Bahan baku serta batas inklusi Knowledge Centre (bila aktif) tetap berlaku bersamaan. Yang paling ketat yang dipakai.</li><li>Bahan yang tidak dicentang di halaman Formulasi tidak dipakai. Aturan dengan Min lebih dari 0 pada bahan itu membuat hasil Tidak ada solusi, dan aplikasi menampilkan peringatan.</li><li>Panel <b>Periksa aturan</b> di bawah tabel menampilkan peringatan otomatis: Min lebih besar dari Maks; Min aturan melebihi Max % bahan di database; Min % bahan di database melebihi Maks aturan; total semua batas minimum (database dan aturan) melebihi 100% per spesies; serta bahan wajib yang tidak dicentang.</li><li>Sebelum versi 1.3.1, rentang harus dibuat dari dua aturan (≥ dan ≤). Aturan lama itu tetap berfungsi dan tidak perlu diubah.</li></ul>
<h4>Mesin &amp; proses</h4>
<p>Buat satu baris per mesin/line. Kolom utama: <b>t/h</b> (kapasitas nominal), <b>Maks lemak %</b> dan <b>Maks serat %</b> (jadi batasan solver), <b>Min skor pel</b> (dasar risiko kualitas pellet), <b>Maks load %</b>, <b>Kondisioner °C</b>, <b>Retensi kondisioner (detik)</b> (lebih panjang menambah skor pelet efektif, lebih pendek mengurangi; acuan 30 detik, maks ±8 poin), <b>Steam kg/t</b>, <b>kWh/t</b>, <b>Die L/D</b>, <b>Biaya lain Rp/kg</b>. Kolom kalibrasi (Adj pel, Koef. retensi, Base load %, Koef. serat, Koef. lemak, Penalti serat) mengatur model risiko; bawaan Adj 0, koef. retensi 4 poin per penggandaan, base load 70. Buat mesin terpisah untuk line udang/ikan agar peringatan tidak salah sasaran.</p>
<h4>Knowledge Centre (permanen)</h4>
<p>Tertanam di aplikasi, tidak bisa dihapus dan tidak ikut terhapus saat Restore. Isi: Modul 1 bahan baku (rentang nutrisi tipikal, batas inklusi maksimum per spesies, catatan mutu, rujukan), Modul 2 mesin &amp; proses (KC-MP), Modul 2b saran parameter proses per tahap dan spesies (KC-PS1 sampai PS4), Modul 3 kewajaran harga, <b>Modul 4 kondisi iklim dan cuaca</b> (catatan KC-CL per spesies), dan <b>Modul 5 tekanan steam vs temperatur</b> (tabel steam jenuh, catatan KC-ST, dan kalkulator steam dan kadar air kondisioning). Kotak centang <i>Pakai batas inklusi Knowledge Centre</i> mengaktifkan batas maksimum per spesies sebagai batasan solver. Isinya acuan umum industri; tinjau sebelum jadi dasar keputusan.</p>
<h4>Knowledge saya dan impor dokumen</h4>
<p>Catatan pengetahuan pribadi per bahan (isi, sumber, keyakinan Low/Medium/High, status). Hanya status <b>Approved</b> yang tampil di kartu formula dan laporan. <b>Impor dokumen (Premium):</b> pilih file DOCX, TXT, MD, atau CSV (PDF: simpan dulu sebagai DOCX/TXT); paragraf yang menyebut nama bahan diusulkan sebagai Draft; centang yang dipakai, perbaiki bila perlu, <i>Tambahkan terpilih sebagai Draft</i>, lalu ubah Status ke Approved.</p>
<h4>Data transaksi</h4>
<div class="w"><table><tr><th>Menu</th><th>Isi catatan</th><th>Fungsi</th></tr>
<tr><td>Riwayat</td><td>Formula tersimpan (nama, tanggal, mesin, komposisi, biaya, estimasi t/h)</td><td>Arsip, laporan PDF, bandingkan t/h aktual</td></tr>
<tr><td>Batch produksi</td><td>Tanggal, formula, ton, jam, load %, PDI %, fines %, kWh/t, steam kg/t, kondisi, catatan</td><td>Deviasi terhadap estimasi, kalibrasi mesin</td></tr>
<tr><td>Pembelian</td><td>Tanggal, bahan, pemasok, ton, Rp/kg, PO/invoice, catatan</td><td>Rata-rata tertimbang; kirim harga ke Database biaya</td></tr>
<tr><td>Hasil lab</td><td>Tanggal, bahan, lot, air, CP, lemak, serat, Ca, avP, Lys, Met</td><td>Selisih dengan database; perbarui nilai bahan</td></tr></table></div>
<h4>Backup dan Restore (Premium)</h4>
<ul><li><b>Backup:</b> Pengaturan, Backup data; file JSON diunduh ke folder Download. Simpan salinan di flashdisk/cloud pribadi.</li><li><b>Restore:</b> pilih file backup; seluruh data saat ini diganti isi backup (termasuk akun dan password saat backup dibuat). Jangan edit file backup manual.</li><li>Lakukan Backup setelah perubahan penting dan sebelum update aplikasi, menghapus data browser, atau ganti perangkat.</li></ul>`,
en:`<p>Master data (reference data that rarely changes) determines formula quality, so fill it in correctly first. Click a table cell and type to edit (saved automatically); <b>+ Add</b> adds a row, <b>×</b> deletes (with confirmation). In Demo, adding rows is limited.</p>
<h4>Raw materials</h4>
<p>Built in: 17 sample materials (corn, rice bran, SBM 46, MBM, wheat pollard, palm oil, limestone, DCP, DL-Met, L-Lys HCl, salt, premix, bentonite, fish meal 60, wheat flour, CGM 60, fish oil).</p>
<div class="w"><table><tr><th>Column</th><th>Meaning</th></tr>
<tr><td>Group</td><td>Nutrient-source group (see below).</td></tr>
<tr><td>Material</td><td>Name; it is the matching key for the Knowledge Centre and ingredient rules.</td></tr>
<tr><td>ME</td><td>Metabolizable energy, kcal/kg (poultry value; not a target in shrimp/fish presets).</td></tr>
<tr><td>CP, Fat, Fiber</td><td>Crude protein, fat, crude fiber (%).</td></tr>
<tr><td>Ca, avP, Lys, Met</td><td>Calcium, available phosphorus, lysine, methionine (%).</td></tr>
<tr><td>Rp/kg</td><td>Price used by the solver; update via the Costs/Purchases menus.</td></tr>
<tr><td>Min %, Max %</td><td>Inclusion limits in the formula (built-in premix is locked at 0.3%).</td></tr>
<tr><td>Pel</td><td>Material pelletability score 0-100; formula score = weighted average. Higher is easier to pellet.</td></tr></table></div>
<p class="mu">If a material value is outside the Knowledge Centre's typical range, a yellow warning box appears. It is not an error; verify against lab results.</p>
<p><b>Nutrient-source groups.</b> The table is grouped by the nutrient it targets: <b>Energy</b> (corn, bran, pollard, wheat flour), <b>Fats &amp; oils</b>, <b>Protein</b> (SBM, MBM, fish meal, CGM), <b>Amino acids</b> (DL-Met, L-Lys), <b>Minerals</b> (limestone, DCP, salt), <b>Premix &amp; additives</b> (premix, bentonite) and <b>Others</b>. Materials are recognised automatically from their names; change the Group column when needed. Groups are used for the material selection on the Formulation page, Group-type ingredient rules, and the composition-by-group summary in results and reports.</p>
<h4>Costs</h4>
<ul><li><b>Raw material prices (history):</b> record prices by date and supplier. Materials with prices &gt;30 days old or missing are flagged. <i>Apply latest prices to materials</i> moves the latest prices into the Rp/kg column.</li><li><b>Energy rates:</b> Rp/kWh and Rp/kg steam.</li><li><b>Fixed cost per kg feed:</b> labor, overhead, packaging, etc.</li></ul>
<p>True manufacturing cost (Rp/kg) = raw materials + (kWh/t × electricity rate ÷ 1,000) + (steam kg/t × steam rate ÷ 1,000) + other machine cost + sum of fixed costs.</p>
<h4>Ingredient rules</h4>
<p>Rules are hard constraints in the solver. Choose the <b>Type</b> first (the A and B options follow the type), then material or group A (and B if needed), value v (for min–max types, the <b>v / Min %</b> column is the lower limit and the <b>Max %</b> column is the upper limit), target species, On/Off status and reason/source.</p><div class="w"><table><tr><th>Type</th><th>Meaning</th><th>Example</th></tr><tr><td>A+B ≤ v% / ≥ v%</td><td>Combined total of two materials</td><td>bran + pollard ≤ 25%</td></tr><tr><td>A ≤ v×B / ≥ v×B</td><td>Ratio of two materials</td><td>corn ≤ 2.2 × SBM</td></tr><tr><td>A ≤ v% / ≥ v% (single material)</td><td>Limit or minimum of one material; B unused</td><td>fish meal ≤ 8%</td></tr><tr><td>A min–max % (single material)</td><td>Usage range of one material: lower and upper limit in one rule; B unused</td><td>Corn 40% to 60%</td></tr><tr><td>Group A ≤ v% / ≥ v%</td><td>Total of one nutrient-source group</td><td>Protein group ≤ 40%; Minerals group ≥ 3%</td></tr><tr><td>Group A min–max %</td><td>Range for the total of one group</td><td>Protein group 25% to 35%</td></tr></table></div><p>The <b>Applies to</b> column limits a rule to one species (All, Broiler, Layer, Shrimp or Fish), so different limits per species are recorded as separate rules. Rules outside the species being calculated are not used and do not appear in results. Rules that are too tight can leave a formula without a solution; use Off to test. Built-in sample rule: Limestone + DCP ≤ 14%. Demo allows at most 2 rules; one min–max rule uses only one row.</p><p><b>Limiting material usage with a min–max range</b> (e.g. corn at least 40% and at most 60%):</p><ol><li>Open the <b>Ingredient rules</b> tab and press <b>+ Add</b>.</li><li>Under <b>Type</b> choose <i>A min–max % (single material)</i>. To limit the total of a group, choose <i>Group A min–max %</i>.</li><li>Select the material in column <b>A</b> (column B is unused).</li><li>Enter the lower limit in <b>v / Min %</b> and the upper limit in <b>Max %</b>.</li><li>Choose <b>Applies to</b> (All or one species), make sure the status is <b>On</b>, and enter the reason/source.</li><li>Repeat for other materials, then run <b>Generate</b> on the Formulation page.</li></ol><div class="w"><table><tr><th>Type</th><th>A</th><th>v / Min %</th><th>Max %</th><th>Meaning</th></tr><tr><td>A min–max %</td><td>Jagung / Corn</td><td>40</td><td>60</td><td>40% ≤ Corn ≤ 60%</td></tr><tr><td>A min–max %</td><td>SBM 46</td><td>20</td><td>30</td><td>20% ≤ SBM 46 ≤ 30%</td></tr></table></div><ul><li>The lower and upper limits are used by the solver as two hard constraints at once. The solver still picks the lowest cost inside the range, so results often sit exactly on the lower or upper limit.</li><li>The <b>Min %</b> and <b>Max %</b> limits in Raw materials and the Knowledge Centre inclusion limits (when active) still apply at the same time. The tightest one wins.</li><li>Materials unticked on the Formulation page are not used. A rule with Min above 0 on such a material gives No solution, and the app shows a warning.</li><li>The <b>Check rules</b> panel below the table shows automatic warnings: Min greater than Max; rule Min above the material's Max % in the database; the material's database Min % above the rule Max; the total of all minimums (database and rules) above 100% per species; and required materials that are unticked.</li><li>Before version 1.3.1 a range had to be built from two rules (≥ and ≤). Those old rules keep working and need no change.</li></ul>
<h4>Machines &amp; process</h4>
<p>Create one row per machine/line. Main columns: <b>t/h</b> (nominal capacity), <b>Max fat %</b> and <b>Max fiber %</b> (solver constraints), <b>Min pel score</b> (basis of pellet quality risk), <b>Max load %</b>, <b>Conditioner °C</b>, <b>Conditioning retention (s)</b> (longer adds to the effective pellet score, shorter reduces it; 30 s reference, max ±8 points), <b>Steam kg/t</b>, <b>kWh/t</b>, <b>Die L/D</b>, <b>Other Rp/kg</b>. Calibration columns (Pel adj, Retention coef, Base load %, Fiber coef, Fat coef, Fiber penalty) tune the risk model; defaults Adj 0, retention coef 4 points per doubling, base load 70. Create separate machines for shrimp/fish lines so warnings stay relevant.</p>
<h4>Knowledge Centre (permanent)</h4>
<p>Built into the app, cannot be deleted and is not erased by Restore. Contents: Module 1 raw materials (typical nutrient ranges, maximum inclusion per species, quality notes, references), Module 2 machines &amp; process (KC-MP), Module 2b process parameter advice per stage and species (KC-PS1 to PS4), Module 3 price reasonableness, <b>Module 4 climate and weather</b> (KC-CL notes per species), and <b>Module 5 steam pressure vs temperature</b> (saturated steam table, KC-ST notes, and a steam and conditioning moisture calculator). The checkbox <i>Use Knowledge Centre inclusion limits</i> applies per-species maximums as solver constraints. Contents are general industry references; review before relying on them.</p>
<h4>My knowledge and document import</h4>
<p>Personal knowledge notes per material (text, source, confidence Low/Medium/High, status). Only <b>Approved</b> notes appear on formula cards and reports. <b>Document import (Premium):</b> choose a DOCX, TXT, MD or CSV file (PDF: save as DOCX/TXT first); paragraphs naming a material are proposed as Draft; tick the ones to use, fix if needed, <i>Add selected as Draft</i>, then set Status to Approved.</p>
<h4>Transaction data</h4>
<div class="w"><table><tr><th>Menu</th><th>Records</th><th>Purpose</th></tr>
<tr><td>History</td><td>Saved formulas (name, date, machine, composition, cost, estimated t/h)</td><td>Archive, PDF report, compare actual t/h</td></tr>
<tr><td>Production batches</td><td>Date, formula, tons, hours, load %, PDI %, fines %, kWh/t, steam kg/t, condition, notes</td><td>Deviation vs estimate, machine calibration</td></tr>
<tr><td>Purchases</td><td>Date, material, supplier, tons, Rp/kg, PO/invoice, notes</td><td>Weighted average; send prices to the Cost database</td></tr>
<tr><td>Lab results</td><td>Date, material, lot, moisture, CP, fat, fiber, Ca, avP, Lys, Met</td><td>Difference vs database; update material values</td></tr></table></div>
<h4>Backup and Restore (Premium)</h4>
<ul><li><b>Backup:</b> Settings, Backup data; a JSON file is downloaded to your Downloads folder. Keep a copy on a flash drive/personal cloud.</li><li><b>Restore:</b> choose a backup file; all current data is replaced by the backup (including the account and password at backup time). Do not edit backup files by hand.</li><li>Back up after important changes and before updating the app, clearing browser data or switching devices.</li></ul>`}},

{id:'first',t:{id:'Membuat formula pertama',en:'Your first formula'},b:{
id:`<ol><li><b>Periksa bahan baku.</b> Ganti nilai contoh dengan data lab Anda dan sesuaikan Min/Max.</li><li><b>Perbarui harga.</b> Di Biaya, tambahkan harga terbaru per bahan, tekan <i>Terapkan harga terbaru</i>, lalu isi tarif energi dan biaya tetap.</li><li><b>Atur mesin.</b> Di Mesin &amp; proses isi kapasitas, batas lemak/serat, min skor pel, maks load, suhu dan retensi kondisioner, steam, kWh/t, dan L/D.</li><li><b>Buka Formulasi.</b> Pilih <b>Target nutrisi</b> dan <b>Mesin/Line</b>; perhatikan keterangan mesin di atas tombol hitung.</li><li><b>Pilih kondisi iklim/musim</b> (Normal, Kemarau/panas, Penghujan/lembab, Pancaroba). Untuk broiler/layer pada kemarau/panas, target disesuaikan otomatis bila kotak penyesuaian dicentang; kondisi lain hanya menambah catatan.</li><li><b>Pilih bahan baku yang digunakan.</b> Pada kartu <i>Bahan baku yang digunakan</i>, centang bahan yang tersedia; bahan yang tidak dicentang tidak dipakai saat menghitung (mis. stok habis). Tersedia tombol per kelompok, Pilih semua, dan Kosongkan. Pilihan tersimpan sampai Anda ubah.</li><li>Sesuaikan target pada kolom Min/Max bila perlu (kosong = tanpa batasan).</li><li>Tekan <b>Hitung formula</b>; hasil muncul sebagai kartu kandidat. Baca (lihat bagian Membaca hasil), bandingkan, lalu <b>Simpan formula</b>.</li><li>Premium: <b>Cetak / PDF</b> untuk laporan.</li></ol>
<p><b>Preset target:</b> Broiler Starter/Grower/Finisher, Layer, Udang Vaname Starter/Grower, Ikan Nila Grower, Ikan Lele Grower. Preset adalah titik awal; sesuaikan dengan strain, program pakan, dan standar Anda.</p>
<h4>Bila muncul "Tidak ada solusi"</h4>
<p>Target tidak bisa dipenuhi dengan bahan dan batas saat ini. Periksa berurutan: (1) longgarkan target; (2) naikkan Max bahan kunci; (3) matikan batas inklusi Knowledge Centre untuk uji; (4) matikan aturan bahan satu per satu; (5) longgarkan batas lemak/serat mesin; (6) tambahkan bahan sumber yang dibutuhkan; (7) periksa centang bahan baku dan penyesuaian iklim; (8) periksa aturan bahan per spesies.</p>`,
en:`<ol><li><b>Check raw materials.</b> Replace sample values with your lab data and adjust Min/Max.</li><li><b>Update prices.</b> In Costs, add the latest price per material, press <i>Apply latest prices</i>, then fill in energy rates and fixed costs.</li><li><b>Set up the machine.</b> In Machines &amp; process enter capacity, fat/fiber limits, min pel score, max load, conditioner temperature and retention, steam, kWh/t and L/D.</li><li><b>Open Formulation.</b> Choose the <b>Nutrition target</b> and <b>Machine/Line</b>; read the machine note above the generate button.</li><li><b>Choose the climate/season</b> (Normal, Dry/hot, Rainy/humid, Transition). For broiler/layer in dry/hot conditions, targets are adjusted automatically when the adjustment box is ticked; other conditions only add notes.</li><li><b>Choose the raw materials to use.</b> On the <i>Raw materials to use</i> card, tick the materials that are available; unticked materials are not used when calculating (e.g. out of stock). Per-group buttons, Select all and Clear all are available. Your selection is kept until you change it.</li><li>Adjust targets in the Min/Max cells if needed (empty = no limit).</li><li>Press <b>Generate</b>; results appear as candidate cards. Read them (see Reading the results), compare, then <b>Save formula</b>.</li><li>Premium: <b>Print / PDF</b> for the report.</li></ol>
<p><b>Target presets:</b> Broiler Starter/Grower/Finisher, Layer, Vannamei Shrimp Starter/Grower, Tilapia Grower, Catfish Grower. Presets are a starting point; adapt them to your strain, feeding program and standards.</p>
<h4>If "No solution" appears</h4>
<p>The targets cannot be met with the current materials and limits. Check in order: (1) relax targets; (2) raise the Max of key materials; (3) turn off Knowledge Centre inclusion limits to test; (4) turn off ingredient rules one by one; (5) loosen the machine's fat/fiber limits; (6) add the required source materials; (7) check the material ticks and the climate adjustment; (8) check the ingredient rules per species.</p>`}},

{id:'results',t:{id:'Membaca hasil formula',en:'Reading the results'},b:{
id:`<h4>Tiga kandidat</h4>
<div class="w"><table><tr><th>Kandidat</th><th>Pendekatan</th></tr>
<tr><td>Biaya terendah</td><td>Menekan biaya bahan baku tanpa target pelet tambahan (hanya batas mesin).</td></tr>
<tr><td>Risiko produksi terendah</td><td>Meminta skor pelet setinggi mungkin (mulai min skor mesin + 12, turun bertahap sampai ada solusi).</td></tr>
<tr><td>Seimbang biaya vs produksi</td><td>Meminta skor pelet sekitar min skor mesin + 5.</td></tr></table></div>
<p>FFMI tidak meranking otomatis; pilihan akhir ada pada Anda. Di Demo hanya kandidat biaya terendah yang tampil.</p>
<h4>Isi kartu kandidat</h4>
<ul><li><b>Komposisi:</b> bar warna dan tabel persentase.</li><li><b>Biaya:</b> bahan baku per kg dan biaya manufaktur sebenarnya per kg.</li><li><b>Nutrisi:</b> ME, CP, Lys, Met, Ca, avP, serat, lemak.</li><li><b>Kelayakan:</b> <i>Feasible</i> bila tidak ada risiko Tinggi, dengan estimasi output t/h.</li><li><b>Risiko:</b> Kualitas pellet, Choking, Motor load, Dampak kapasitas (Rendah/Sedang/Tinggi). <b>Mengapa?</b> menjelaskan alasannya, termasuk pengaruh retensi kondisioner.</li><li><b>Aturan bahan diterapkan</b> yang ikut membatasi hasil (hanya aturan On yang berlaku untuk spesies target).</li><li><b>Bahan tidak dipakai</b> (tidak tersedia), <b>Komposisi per kelompok</b> (Energi, Protein, dst.), <b>Kondisi iklim</b> beserta penyesuaian target, peringatan jamur/mikotoksin pada penghujan, dan catatan Knowledge Centre (KC-CL).</li><li><b>Peringatan Knowledge Centre (merah):</b> parameter proses di luar acuan, serat &gt;5%, lemak tambahan &gt;3%, skor pelet rendah untuk pakan akuatik.</li><li><b>Catatan bahan (KC):</b> catatan mutu bahan yang dipakai &gt;0,5%, dengan kode rujukan (mis. KC-RM3).</li><li><b>Saran parameter proses per tahap</b> dan <b>Knowledge terkait</b> (catatan Approved).</li></ul>
<h4>Aturan penilaian risiko</h4>
<div class="w"><table><tr><th>Risiko</th><th>Rendah</th><th>Sedang</th><th>Tinggi</th></tr>
<tr><td>Kualitas pellet</td><td>Skor pelet efektif ≥ min + 8</td><td>Antara min dan min + 8</td><td>Di bawah min skor mesin</td></tr>
<tr><td>Choking</td><td>Serat ≤ 85% batas mesin</td><td>85% sampai 100%</td><td>Serat di atas batas</td></tr>
<tr><td>Motor load</td><td>Estimasi load rendah</td><td>Dalam 8 poin dari maks load</td><td>Di atas maks load</td></tr>
<tr><td>Dampak kapasitas</td><td>Output ≥ 97% nominal</td><td>90% sampai 97%</td><td>Di bawah 90% nominal</td></tr></table></div>
<p class="mu">Skor pelet efektif = skor bahan + Adj pel mesin + efek retensi kondisioner. Lemak tambahan di atas 3% menaikkan risiko kualitas pellet minimal ke Sedang.</p>
<h4>Saran parameter proses per tahap</h4>
<p>Panel menyesuaikan spesies, formula (serat, risiko pellet, lemak, bahan mikro), dan mesin Anda: <b>Grinding</b> (ukuran partikel/GMD dan kadar air bahan masuk; tanpa data lab diasumsikan 12%), <b>Mixing</b> (homogenitas CV, waktu campur, kadar air, porsi minyak), <b>Conditioning</b> (suhu, kadar air, retensi, steam; retensi pendek menaikkan saran suhu), <b>Pelleting</b> (suhu keluar die, L/D, kadar air pellet, beban motor). Kolom Mesin Anda menampilkan ✓ (dalam rentang) atau ⚠ (di luar rentang).</p>
<h4>Memutuskan</h4>
<ul><li>Pilih kandidat dengan risiko yang bisa diterima mesin Anda, bukan hanya yang termurah.</li><li>Selisih biaya antar kandidat adalah harga kenyamanan produksi; bandingkan dengan biaya downtime dan reject.</li><li>Uji kandidat terpilih di produksi, lalu catat hasilnya di Batch produksi.</li></ul>`,
en:`<h4>Three candidates</h4>
<div class="w"><table><tr><th>Candidate</th><th>Approach</th></tr>
<tr><td>Lowest cost</td><td>Minimises raw material cost with no extra pellet target (machine limits only).</td></tr>
<tr><td>Lowest production risk</td><td>Asks for the highest possible pellet score (starts at machine min score + 12, steps down until a solution exists).</td></tr>
<tr><td>Balanced cost vs production</td><td>Asks for a pellet score around machine min score + 5.</td></tr></table></div>
<p>FFMI does not rank automatically; the final choice is yours. In Demo only the lowest-cost candidate is shown.</p>
<h4>What a candidate card shows</h4>
<ul><li><b>Composition:</b> colour bar and percentage table.</li><li><b>Cost:</b> raw material per kg and true manufacturing cost per kg.</li><li><b>Nutrients:</b> ME, CP, Lys, Met, Ca, avP, fiber, fat.</li><li><b>Feasibility:</b> <i>Feasible</i> when there is no High risk, with estimated output t/h.</li><li><b>Risks:</b> Pellet quality, Choking, Motor load, Capacity impact (Low/Medium/High). <b>Why?</b> explains the reasons, including the effect of conditioning retention.</li><li><b>Ingredient rules applied</b> that helped shape the result (only On rules that apply to the target species).</li><li><b>Materials not used</b> (unavailable), <b>Composition by group</b> (Energy, Protein, etc.), <b>Climate</b> with target adjustments, mold/mycotoxin warnings in rainy conditions, and Knowledge Centre notes (KC-CL).</li><li><b>Knowledge Centre warnings (red):</b> process parameters outside reference, fiber &gt;5%, added fat &gt;3%, low pellet score for aquatic feed.</li><li><b>Material notes (KC):</b> quality notes for materials used at &gt;0.5%, with reference codes (e.g. KC-RM3).</li><li><b>Process parameter advice per stage</b> and <b>Related knowledge</b> (Approved notes).</li></ul>
<h4>Risk rating rules</h4>
<div class="w"><table><tr><th>Risk</th><th>Low</th><th>Medium</th><th>High</th></tr>
<tr><td>Pellet quality</td><td>Effective pellet score ≥ min + 8</td><td>Between min and min + 8</td><td>Below machine min score</td></tr>
<tr><td>Choking</td><td>Fiber ≤ 85% of machine limit</td><td>85% to 100%</td><td>Fiber above limit</td></tr>
<tr><td>Motor load</td><td>Low estimated load</td><td>Within 8 points of max load</td><td>Above max load</td></tr>
<tr><td>Capacity impact</td><td>Output ≥ 97% of nominal</td><td>90% to 97%</td><td>Below 90% of nominal</td></tr></table></div>
<p class="mu">Effective pellet score = material score + machine Pel adj + conditioning retention effect. Added fat above 3% raises pellet quality risk to at least Medium.</p>
<h4>Process parameter advice per stage</h4>
<p>The panel adapts to species, formula (fiber, pellet risk, fat, micro-ingredients) and your machine: <b>Grinding</b> (particle size/GMD and incoming moisture; without lab data 12% is assumed), <b>Mixing</b> (homogeneity CV, mixing time, moisture, oil share), <b>Conditioning</b> (temperature, moisture, retention, steam; short retention raises the suggested temperature), <b>Pelleting</b> (die exit temperature, L/D, pellet moisture, motor load). The Your machine column shows ✓ (within range) or ⚠ (outside range).</p>
<h4>Deciding</h4>
<ul><li>Pick the candidate whose risk your machine can accept, not just the cheapest.</li><li>The cost gap between candidates is the price of production comfort; compare it with downtime and reject costs.</li><li>Trial the chosen candidate in production, then record the result in Production batches.</li></ul>`}},

{id:'routine',t:{id:'Penggunaan selanjutnya (rutin)',en:'Ongoing use (routine)'},b:{
id:`<div class="w"><table><tr><th>Frekuensi</th><th>Kegiatan</th><th>Menu</th></tr>
<tr><td>Saat stok bahan berubah</td><td>Perbarui centang bahan baku yang tersedia sebelum menghitung formula</td><td>Formulasi</td></tr>
<tr><td>Pergantian musim</td><td>Pilih kondisi iklim, baca catatan KC-CL, cek kadar air bahan dan mikotoksin, hitung ulang steam dan kadar air</td><td>Formulasi, Knowledge Centre (Modul 4 dan 5)</td></tr>
<tr><td>Setiap pembelian</td><td>Catat pembelian (tanggal, pemasok, ton, harga)</td><td>Pembelian</td></tr>
<tr><td>Setiap kedatangan/lot</td><td>Catat hasil lab (air dan proksimat)</td><td>Hasil lab</td></tr>
<tr><td>Setiap batch produksi</td><td>Catat ton, jam, load, kWh/t, steam, kondisi</td><td>Batch produksi</td></tr>
<tr><td>Mingguan</td><td>Kirim harga pembelian ke Database biaya, terapkan harga terbaru, hitung ulang formula aktif</td><td>Pembelian, Biaya, Formulasi</td></tr>
<tr><td>Bulanan</td><td>Tinjau deviasi batch dan terapkan kalibrasi; tinjau selisih lab; cek kewajaran harga</td><td>Batch produksi, Hasil lab, Knowledge Centre</td></tr>
<tr><td>Setelah perubahan mesin/die/kondisioner</td><td>Perbarui parameter mesin, hitung ulang formula</td><td>Mesin &amp; proses, Formulasi</td></tr>
<tr><td>Rutin</td><td>Backup data (Premium)</td><td>Pengaturan</td></tr></table></div>
<h4>Memperbarui harga dari transaksi</h4>
<ol><li>Isi data di Pembelian.</li><li>Tekan <i>Kirim harga ke Database biaya</i> (Premium); pembelian yang sudah terkirim ditandai agar tidak ganda.</li><li>Di Biaya, tekan <i>Terapkan harga terbaru ke bahan baku</i>.</li><li>Hitung ulang formula.</li></ol>
<h4>Memperbarui nilai bahan dari lab</h4>
<ol><li>Isi Hasil lab (minimal 2 sampel per bahan).</li><li>Pada kartu rata-rata lab vs database, periksa lalu tekan <i>Terapkan</i> (Premium).</li><li>CP, lemak, serat, Ca, avP, Lys, Met bahan itu diperbarui; ME dan skor Pel tidak berubah otomatis. Hapus sampel yang tidak mewakili (kontaminasi, salah lot) sebelum menerapkan.</li></ol>
<h4>Mencatat batch dan kalibrasi</h4>
<ol><li>Simpan formula yang dipakai di produksi (Riwayat). Batch baru memerlukan minimal satu formula tersimpan.</li><li>Di Batch produksi, <i>+ Tambah batch</i>, pilih formula, isi ton, jam, load %, kWh/t, dst.</li><li>Setelah minimal 3 batch per mesin, kartu Kalibrasi model menyarankan kapasitas efektif dan base load baru.</li><li>Tekan <i>Terapkan</i> dan konfirmasi (Premium). Estimasi berikutnya memakai nilai baru.</li></ol>
<p class="mu">Batch tidak normal (trip, choking) ikut dihitung dalam rata-rata. Koreksi atau hapus batch yang tidak mewakili sebelum menerapkan saran.</p>`,
en:`<div class="w"><table><tr><th>Frequency</th><th>Activity</th><th>Menu</th></tr>
<tr><td>When stock changes</td><td>Update the ticks of available raw materials before calculating formulas</td><td>Formulation</td></tr>
<tr><td>Season change</td><td>Choose the climate, read the KC-CL notes, check material moisture and mycotoxins, recalculate steam and moisture</td><td>Formulation, Knowledge Centre (Modules 4 and 5)</td></tr>
<tr><td>Every purchase</td><td>Record the purchase (date, supplier, tons, price)</td><td>Purchases</td></tr>
<tr><td>Every arrival/lot</td><td>Record lab results (moisture and proximate)</td><td>Lab results</td></tr>
<tr><td>Every production batch</td><td>Record tons, hours, load, kWh/t, steam, condition</td><td>Production batches</td></tr>
<tr><td>Weekly</td><td>Send purchase prices to the Cost database, apply latest prices, recalculate active formulas</td><td>Purchases, Costs, Formulation</td></tr>
<tr><td>Monthly</td><td>Review batch deviations and apply calibration; review lab differences; check price reasonableness</td><td>Production batches, Lab results, Knowledge Centre</td></tr>
<tr><td>After machine/die/conditioner changes</td><td>Update machine parameters, recalculate formulas</td><td>Machines &amp; process, Formulation</td></tr>
<tr><td>Regularly</td><td>Back up data (Premium)</td><td>Settings</td></tr></table></div>
<h4>Updating prices from transactions</h4>
<ol><li>Fill in Purchases.</li><li>Press <i>Send prices to Cost database</i> (Premium); purchases already sent are marked to avoid duplicates.</li><li>In Costs, press <i>Apply latest prices to materials</i>.</li><li>Recalculate formulas.</li></ol>
<h4>Updating material values from lab</h4>
<ol><li>Fill in Lab results (at least 2 samples per material).</li><li>On the lab average vs database card, check then press <i>Apply</i> (Premium).</li><li>CP, fat, fiber, Ca, avP, Lys, Met of that material are updated; ME and Pel score do not change automatically. Delete unrepresentative samples (contamination, wrong lot) before applying.</li></ol>
<h4>Recording batches and calibrating</h4>
<ol><li>Save the formula used in production (History). A new batch needs at least one saved formula.</li><li>In Production batches, <i>+ Add batch</i>, choose the formula, enter tons, hours, load %, kWh/t, etc.</li><li>After at least 3 batches per machine, the Model calibration card suggests a new effective capacity and base load.</li><li>Press <i>Apply</i> and confirm (Premium). Later estimates use the new values.</li></ol>
<p class="mu">Abnormal batches (trips, choking) are included in the averages. Correct or delete unrepresentative batches before applying the suggestion.</p>`}},

{id:'analysis',t:{id:'Analisa dan evaluasi',en:'Analysis and evaluation'},b:{
id:`<p>Modul analisa lanjutan (mis. tren deviasi dan dashboard per pemasok) belum termasuk dan direncanakan pada pengembangan berikutnya.</p>
<h4>Deviasi batch</h4>
<div class="w"><table><tr><th>Kolom</th><th>Arti</th><th>Cara membaca</th></tr>
<tr><td>t/h</td><td>Output aktual = ton ÷ jam</td><td>Bandingkan dengan estimasi</td></tr>
<tr><td>Est.</td><td>Estimasi output formula untuk mesin terkait</td><td>Dari parameter mesin saat ini</td></tr>
<tr><td>Δ t/h</td><td>Selisih output aktual terhadap estimasi (%)</td><td>Negatif besar: kapasitas nominal terlalu optimistis atau formula lebih sulit</td></tr>
<tr><td>Δ load</td><td>Selisih load aktual terhadap estimasi (poin)</td><td>Positif: mesin bekerja lebih berat dari estimasi</td></tr>
<tr><td>Δ Rp/kg energi</td><td>(kWh/t aktual − standar mesin) × tarif listrik</td><td>Positif: energi lebih boros dari standar</td></tr></table></div>
<p class="mu">PDI dan fines dicatat sebagai data mutu, tetapi belum dipakai dalam deviasi atau kalibrasi.</p>
<h4>Kalibrasi mesin</h4>
<p>Dengan minimal 3 batch per mesin, aplikasi membandingkan rasio output aktual/estimasi dan selisih load rata-rata, lalu menyarankan kapasitas efektif dan base load baru (Premium).</p>
<h4>Selisih hasil lab</h4>
<p>Tabel selisih terhadap database menandai merah selisih lebih dari ±5% dan kadar air di atas 14%. Selisih berulang pada satu bahan atau pemasok adalah sinyal untuk memperbarui nilai bahan atau meninjau pemasok.</p>
<h4>Kewajaran harga (Knowledge Centre, Modul 3)</h4>
<ol><li>Buka Knowledge Centre dan gulir ke Modul 3.</li><li>Pilih preset spesies dan mesin, tekan <i>Hitung</i>.</li><li><b>Harga bayangan</b> aktif: tambahan biaya per kg pakan bila satu unit nutrien/batasan dinaikkan; menunjukkan batasan paling mahal.</li><li><b>Break-even</b> adalah harga tertinggi agar bahan masih kompetitif; <b>Rasio</b> = harga ÷ break-even.</li></ol>
<div class="w"><table><tr><th>Rasio</th><th>Arti</th></tr><tr><td>Di atas 1,05</td><td>Lebih mahal daripada nilai gizi/prosesnya untuk spesifikasi ini.</td></tr><tr><td>0,95 sampai 1,05</td><td>Kompetitif.</td></tr><tr><td>Di bawah 0,95</td><td>Murah: bila dipakai tertahan batas inklusi; bila tidak dipakai, cek mutu atau batas.</td></tr></table></div>
<h4>Steam, suhu, dan kadar air kondisioning (Knowledge Centre, Modul 5)</h4>
<ol><li>Buka Knowledge Centre dan gulir ke Modul 5, bagian kalkulator.</li><li>Pilih mesin dan spesies; isi tekanan steam bar(g), kekeringan steam, suhu mash masuk, suhu target kondisioner, kadar air mash awal, dan efisiensi pemanfaatan steam.</li><li>Baca kebutuhan steam (kg/t), air yang masuk ke mash, kadar air setelah kondisioning (dibandingkan rentang KC-PS3), dan kenaikan steam dan kadar air untuk tiap +10 °C suhu mash.</li><li>Peringatan muncul bila tekanan terlalu rendah, kadar air di luar rentang acuan, atau steam pada data mesin berbeda lebih dari 25% dari hasil hitung.</li></ol>
<p class="mu">Tekanan menentukan suhu jenuh steam; suhu mash ditentukan oleh jumlah steam. Hasil adalah estimasi: kalibrasi dengan suhu dan kadar air yang Anda ukur di lapangan. Pada kondisi penghujan, kadar air awal otomatis disarankan 14%.</p>
<h4>Laporan</h4>
<p>Dari kartu kandidat atau Riwayat, <i>Cetak / PDF</i> (Premium) membuka laporan: komposisi, nutrisi vs target, rincian biaya, parameter proses, kelayakan, aturan bahan, Knowledge Centre, dan saran proses. Di dialog cetak pilih printer atau Save as PDF. Izinkan pop-up bila diblokir browser.</p>`,
en:`<p>Advanced analysis modules (e.g. deviation trends and a per-supplier dashboard) are not included yet and are planned for later development.</p>
<h4>Batch deviation</h4>
<div class="w"><table><tr><th>Column</th><th>Meaning</th><th>How to read</th></tr>
<tr><td>t/h</td><td>Actual output = tons ÷ hours</td><td>Compare with the estimate</td></tr>
<tr><td>Est.</td><td>Estimated output of the formula on that machine</td><td>From current machine parameters</td></tr>
<tr><td>Δ t/h</td><td>Actual output vs estimate (%)</td><td>Large negative: nominal capacity too optimistic or formula harder than expected</td></tr>
<tr><td>Δ load</td><td>Actual load vs estimate (points)</td><td>Positive: machine works harder than estimated</td></tr>
<tr><td>Δ Rp/kg energy</td><td>(actual kWh/t − machine standard) × electricity rate</td><td>Positive: energy use above standard</td></tr></table></div>
<p class="mu">PDI and fines are recorded as quality data but are not yet used in deviation or calibration.</p>
<h4>Machine calibration</h4>
<p>With at least 3 batches per machine, the app compares the actual/estimated output ratio and the average load difference, then suggests a new effective capacity and base load (Premium).</p>
<h4>Lab differences</h4>
<p>The difference-vs-database table marks in red differences beyond ±5% and moisture above 14%. Repeated differences on one material or supplier are a signal to update the material values or review the supplier.</p>
<h4>Price reasonableness (Knowledge Centre, Module 3)</h4>
<ol><li>Open the Knowledge Centre and scroll to Module 3.</li><li>Choose a species preset and machine, press <i>Calculate</i>.</li><li>The active <b>shadow price</b>: extra cost per kg feed if one unit of a nutrient/constraint is raised; it shows the most expensive constraint.</li><li><b>Break-even</b> is the highest price at which the material stays competitive; <b>Ratio</b> = price ÷ break-even.</li></ol>
<div class="w"><table><tr><th>Ratio</th><th>Meaning</th></tr><tr><td>Above 1.05</td><td>More expensive than its nutritional/process value for this specification.</td></tr><tr><td>0.95 to 1.05</td><td>Competitive.</td></tr><tr><td>Below 0.95</td><td>Cheap: if used it is held back by the inclusion limit; if unused, check quality or limits.</td></tr></table></div>
<h4>Steam, temperature and conditioning moisture (Knowledge Centre, Module 5)</h4>
<ol><li>Open the Knowledge Centre and scroll to Module 5, the calculator part.</li><li>Choose the machine and species; enter steam pressure bar(g), steam dryness, mash inlet temperature, target conditioner temperature, initial mash moisture and steam utilisation efficiency.</li><li>Read the steam required (kg/t), water added to the mash, moisture after conditioning (compared with the KC-PS3 range), and the steam and moisture increase for each +10 °C of mash temperature.</li><li>Warnings appear when pressure is too low, moisture is outside the reference range, or the steam in the machine data differs by more than 25% from the calculated value.</li></ol>
<p class="mu">Pressure sets the saturation temperature of steam; mash temperature is set by the amount of steam. Results are estimates: calibrate with temperatures and moisture you measure in the plant. In rainy conditions the initial moisture defaults to 14%.</p>
<h4>Reports</h4>
<p>From a candidate card or History, <i>Print / PDF</i> (Premium) opens a report: composition, nutrients vs target, cost breakdown, process parameters, feasibility, ingredient rules, Knowledge Centre and process advice. In the print dialog choose a printer or Save as PDF. Allow pop-ups if the browser blocks them.</p>`}},

{id:'care',t:{id:'Perawatan dan update',en:'Maintenance and updates'},b:{
id:`<h4>Menjaga data</h4>
<ul><li>Data tersimpan di browser perangkat. <b>Menghapus data situs/riwayat browser, mode incognito, atau ganti browser/profil/perangkat</b> dapat menghilangkan data atau membuatnya tidak terlihat.</li><li>Pengguna Premium: lakukan <b>Backup</b> berkala dan simpan file <code>.json</code> di tempat aman. Backup berisi seluruh formula dan harga Anda, jadi lindungi file itu.</li><li>Login mencegah akses lewat aplikasi, tetapi data tidak dienkripsi di penyimpanan browser: kunci layar dan enkripsi disk perangkat Anda. Jangan memakai komputer bersama tanpa akun sistem operasi terpisah.</li><li>Tinjau berkala harga, hasil lab, dan parameter mesin agar hasil tetap relevan.</li></ul>
<h4>Update aplikasi</h4>
<ul><li><b>Web / aplikasi terinstal:</b> versi baru terambil otomatis saat online. Jika masih tampak versi lama, tutup lalu buka lagi (atau muat ulang dua kali). Cek nomor versi di header.</li><li><b>File unduhan:</b> unduh ZIP terbaru dan ganti <code>FFMI.html</code> lama di lokasi yang sama. <b>Backup dulu</b> (Premium). Buka dengan browser yang sama; data lama dimigrasi otomatis. Bila data kosong, gunakan Restore.</li><li>Manual ini diperbarui bersama setiap versi; lihat <b>Riwayat versi</b>.</li></ul>
<h4>Menghapus aplikasi</h4><p>Hapus file <code>FFMI.html</code> (atau copot aplikasi terinstal). Data di browser tetap ada sampai Anda menghapus data situs di pengaturan browser.</p>`,
en:`<h4>Protecting your data</h4>
<ul><li>Data is stored in the device's browser. <b>Clearing site data/history, incognito mode, or switching browser/profile/device</b> can remove it or make it invisible.</li><li>Premium users: make a <b>Backup</b> regularly and keep the <code>.json</code> file somewhere safe. A backup holds all your formulas and prices, so protect it.</li><li>Login prevents access through the app, but data is not encrypted in browser storage: use your device's screen lock and disk encryption. Do not use a shared computer without separate OS accounts.</li><li>Review prices, lab results and machine parameters regularly so results stay relevant.</li></ul>
<h4>Updating the app</h4>
<ul><li><b>Web / installed app:</b> new versions are fetched automatically when online. If the old version still shows, close and reopen (or reload twice). Check the version number in the header.</li><li><b>Downloaded file:</b> download the latest ZIP and replace the old <code>FFMI.html</code> in the same location. <b>Back up first</b> (Premium). Open with the same browser; old data is migrated automatically. If the data is empty, use Restore.</li><li>This manual is updated with every version; see <b>Version history</b>.</li></ul>
<h4>Removing the app</h4><p>Delete the <code>FFMI.html</code> file (or uninstall the installed app). Data stays in the browser until you clear site data in browser settings.</p>`}},

{id:'trouble',t:{id:'Troubleshooting',en:'Troubleshooting'},b:{
id:`<details><summary>Halaman kosong atau tidak ada layar login.</summary><p>JavaScript nonaktif, browser lama, atau file rusak. Pakai browser terbaru, aktifkan JavaScript, salin ulang FFMI.html.</p></details>
<details><summary>Data hilang atau tampak kosong saat dibuka lagi.</summary><p>Periksa apakah browser, perangkat, alamat web, atau lokasi file sama seperti sebelumnya; data tiap tempat terpisah. Mode privat dan penghapusan data situs juga menghilangkan data. Restore dari backup (Premium).</p></details>
<details><summary>Saya lupa password.</summary><p>Tidak ada reset, dan backup membawa password lama. Satu-satunya cara adalah menghapus data situs browser untuk aplikasi ini, yang menghapus semua data (termasuk aktivasi Premium).</p></details>
<details><summary>Kode akses dinyatakan tidak valid.</summary><p>Format harus <code>FFMI-XXXX-XXXX-XXXX</code>. Periksa huruf O vs angka 0 dan spasi tambahan; salin-tempel persis. Bila tetap gagal, hubungi Megay Studio: <a href="https://wa.me/6281915968790" target="_blank" rel="noopener">WhatsApp 0819 1596 8790</a> atau <a href="mailto:megi.hidayatullah@gmail.com">megi.hidayatullah@gmail.com</a>, sebutkan kode yang Anda terima.</p></details>
<details><summary>Kolom kode akses tidak ada, hanya tombol unduh.</summary><p>Anda sedang di versi web atau aplikasi terinstal (Demo). Aktivasi Premium hanya di file <code>FFMI.html</code> yang diunduh dan dibuka offline.</p></details>
<details><summary>Muncul pesan fitur khusus Premium.</summary><p>Anda di mode Demo. Lihat tabel Demo dan Premium; aktifkan kode akses di file unduhan.</p></details>
<details><summary>Muncul "Tidak ada solusi".</summary><p>Ikuti urutan pemeriksaan di bagian Membuat formula pertama (longgarkan target, naikkan Max bahan, matikan batas Knowledge Centre/aturan bahan, longgarkan batas mesin, tambah bahan).</p></details>
<details><summary>Semua kandidat "Tidak feasible".</summary><p>Ada risiko Tinggi. Baca <i>Mengapa?</i>: tambah retensi/suhu, turunkan serat, pilih kandidat Risiko terendah, tinjau min skor pel mesin.</p></details>
<details><summary>Hanya satu kandidat muncul.</summary><p>Mode Demo; Premium menampilkan 3 kandidat.</p></details>
<details><summary>Layer tidak punya solusi.</summary><p>Limestone dibatasi terlalu rendah atau aturan Limestone + DCP terlalu ketat. Naikkan Max limestone (bawaan 12%) dan aturan (bawaan ≤14%).</p></details>
<details><summary>Peringatan merah pada mesin untuk udang/ikan.</summary><p>Mesin bawaan bertipe pellet mill unggas. Buat mesin terpisah dengan parameter akuatik.</p></details>
<details><summary>Harga di formula tidak berubah setelah input pembelian.</summary><p>Harga belum dikirim/diterapkan: kirim harga ke Database biaya, lalu Terapkan harga terbaru.</p></details>
<details><summary>Tidak bisa menambah batch.</summary><p>Belum ada formula tersimpan; simpan minimal satu formula di Formulasi.</p></details>
<details><summary>Tidak bisa menambah bahan, mesin, atau menyimpan formula.</summary><p>Anda mencapai batas mode Demo (lihat tabel Demo dan Premium).</p></details>
<details><summary>Impor dokumen tidak menghasilkan usulan.</summary><p>Format PDF/DOC lama atau tidak ada nama bahan yang cocok. Konversi ke DOCX/TXT dan pastikan dokumen menyebut nama bahan seperti di database (minimal 3 huruf).</p></details>
<details><summary>Laporan PDF tidak terbuka.</summary><p>Pop-up diblokir browser. Izinkan pop-up untuk halaman ini, lalu tekan Cetak/PDF lagi.</p></details>
<details><summary>Backup tidak terunduh, atau "File backup tidak valid".</summary><p>Unduhan diblokir, atau file bukan backup FFMI/sudah diedit. Cek folder Download dan izin unduhan; pakai file backup asli.</p></details>
<details><summary>Estimasi t/h tidak cocok dengan lapangan.</summary><p>Parameter mesin belum dikalibrasi. Isi batch aktual, jalankan kalibrasi, periksa kapasitas nominal dan retensi.</p></details>
<details><summary>Nilai bahan ditandai di luar rentang tipikal.</summary><p>Bukan error; verifikasi dengan hasil lab Anda.</p></details>
<details><summary>Masih tampil versi lama setelah update.</summary><p>Tutup semua tab/aplikasi FFMI lalu buka lagi, atau muat ulang dua kali. Pada file unduhan, pastikan membuka file yang baru.</p></details>
<details><summary>Tabel terlalu sempit di HP.</summary><p>Gunakan landscape, geser tabel ke samping, atau pakai tablet/laptop untuk input banyak data.</p></details>
<details><summary>Tombol Install tidak berfungsi.</summary><p>Gunakan menu browser (<i>Install app</i> / <i>Tambahkan ke layar utama</i>). Instalasi memerlukan alamat https dan tidak ada di semua browser.</p></details>
<details><summary>Muncul "Tidak ada solusi" setelah mengosongkan beberapa bahan.</summary><p>Bahan yang dicentang tidak cukup untuk memenuhi target. Centang kembali bahan kunci (sumber energi, protein, mineral) atau longgarkan target.</p></details>
<details><summary>Hasil formula berubah setelah memilih Kemarau/panas.</summary><p>Target ME, Lys, Met, dan serat disesuaikan otomatis untuk broiler/layer (lihat Modul 4). Hilangkan centang "Terapkan penyesuaian target iklim" bila tidak diinginkan.</p></details>
<details><summary>Aturan bahan tidak muncul di hasil.</summary><p>Aturan hanya dipakai bila statusnya On dan kolom Berlaku untuk sesuai spesies target yang dihitung.</p></details>
<details><summary>Kelompok bahan salah, atau bahan baru masuk "Lainnya".</summary><p>Ubah kolom Kelompok pada tabel Bahan baku.</p></details>
<details><summary>Pilihan bahan A dan B pada aturan berubah saat mengganti tipe.</summary><p>Itu disengaja: pilih Tipe lebih dulu karena A dan B menyesuaikan (bahan atau kelompok).</p></details>
<details><summary>Setelah menambah aturan min–maks muncul "Tidak ada solusi".</summary><p>Lihat panel <b>Periksa aturan</b> di tab Aturan bahan. Penyebab umum: Min lebih besar dari Maks; Min melebihi Max % bahan di menu Bahan baku atau batas inklusi Knowledge Centre; bahan tidak dicentang di halaman Formulasi; total semua minimum melebihi 100%; atau target nutrisi tidak tercapai dalam rentang itu (mis. protein tidak cukup bila jagung dipaksa tinggi). Longgarkan rentang atau matikan aturan (Off) satu per satu untuk menemukan penyebabnya.</p></details>
<details><summary>Kalkulator steam menampilkan peringatan.</summary><p>Baca pesannya: tekanan terlalu rendah untuk suhu target, kadar air di luar rentang acuan, atau steam pada data mesin berbeda dari hasil hitung.</p></details>`,
en:`<details><summary>Blank page or no login screen.</summary><p>JavaScript disabled, old browser, or a damaged file. Use a recent browser, enable JavaScript, re-copy FFMI.html.</p></details>
<details><summary>Data is gone or looks empty when reopened.</summary><p>Check whether the browser, device, web address or file location is the same as before; data in each place is separate. Private mode and clearing site data also remove it. Restore from a backup (Premium).</p></details>
<details><summary>I forgot my password.</summary><p>There is no reset, and a backup carries the old password. The only way is clearing this app's site data in the browser, which deletes all data (including Premium activation).</p></details>
<details><summary>The access code is reported as invalid.</summary><p>The format must be <code>FFMI-XXXX-XXXX-XXXX</code>. Check letter O vs digit 0 and extra spaces; copy-paste exactly. If it still fails, contact Megay Studio: <a href="https://wa.me/6281915968790" target="_blank" rel="noopener">WhatsApp 0819 1596 8790</a> or <a href="mailto:megi.hidayatullah@gmail.com">megi.hidayatullah@gmail.com</a>, quoting the code you received.</p></details>
<details><summary>There is no access code field, only a download button.</summary><p>You are on the web version or the installed app (Demo). Premium activation works only in the downloaded <code>FFMI.html</code> opened offline.</p></details>
<details><summary>A Premium-only message appears.</summary><p>You are in Demo mode. See the Demo and Premium table; activate the access code in the downloaded file.</p></details>
<details><summary>"No solution" appears.</summary><p>Follow the checklist in Your first formula (relax targets, raise material Max, turn off Knowledge Centre limits/ingredient rules, loosen machine limits, add materials).</p></details>
<details><summary>All candidates are "Not feasible".</summary><p>There is a High risk. Read <i>Why?</i>: add retention/temperature, lower fiber, pick the Lowest risk candidate, review the machine's min pel score.</p></details>
<details><summary>Only one candidate appears.</summary><p>Demo mode; Premium shows 3 candidates.</p></details>
<details><summary>Layer has no solution.</summary><p>Limestone is limited too low or the Limestone + DCP rule is too tight. Raise the Max of limestone (default 12%) and the rule (default ≤14%).</p></details>
<details><summary>Red warnings on the machine for shrimp/fish.</summary><p>The built-in machine is a poultry pellet mill. Create a separate machine with aquatic parameters.</p></details>
<details><summary>Formula prices did not change after entering purchases.</summary><p>Prices were not sent/applied: send prices to the Cost database, then Apply latest prices.</p></details>
<details><summary>I cannot add a batch.</summary><p>No saved formula yet; save at least one formula in Formulation.</p></details>
<details><summary>I cannot add materials, machines or save formulas.</summary><p>You reached the Demo limits (see the Demo and Premium table).</p></details>
<details><summary>Document import gives no proposals.</summary><p>Old PDF/DOC format or no matching material names. Convert to DOCX/TXT and make sure the document names materials as in the database (at least 3 letters).</p></details>
<details><summary>The PDF report does not open.</summary><p>Pop-ups are blocked by the browser. Allow pop-ups for this page, then press Print/PDF again.</p></details>
<details><summary>Backup does not download, or "Invalid backup file".</summary><p>The download is blocked, or the file is not an FFMI backup/was edited. Check the Downloads folder and download permission; use the original backup file.</p></details>
<details><summary>Estimated t/h does not match the field.</summary><p>Machine parameters are not calibrated. Enter actual batches, run calibration, check nominal capacity and retention.</p></details>
<details><summary>A material value is flagged outside the typical range.</summary><p>Not an error; verify with your lab results.</p></details>
<details><summary>The old version still shows after an update.</summary><p>Close all FFMI tabs/apps and reopen, or reload twice. For the downloaded file, make sure you opened the new file.</p></details>
<details><summary>Tables are too narrow on a phone.</summary><p>Use landscape, scroll tables sideways, or use a tablet/laptop for heavy data entry.</p></details>
<details><summary>The Install button does not work.</summary><p>Use the browser menu (<i>Install app</i> / <i>Add to Home screen</i>). Installing requires an https address and is not available in every browser.</p></details>
<details><summary>"No solution" appears after clearing some materials.</summary><p>The ticked materials are not enough to meet the targets. Tick the key materials again (energy, protein, mineral sources) or relax the targets.</p></details>
<details><summary>The formula changed after choosing Dry/hot.</summary><p>ME, Lys, Met and fiber targets are adjusted automatically for broiler/layer (see Module 4). Untick "Apply climate target adjustments" if you do not want this.</p></details>
<details><summary>An ingredient rule does not appear in the results.</summary><p>Rules are used only when their status is On and the Applies to column matches the target species being calculated.</p></details>
<details><summary>A material group is wrong, or a new material falls under "Others".</summary><p>Change the Group column in the Raw materials table.</p></details>
<details><summary>The A and B choices of a rule change when I change the type.</summary><p>This is intended: choose the Type first because A and B adapt (material or group).</p></details>
<details><summary>I get "No solution" after adding a min–max rule.</summary><p>See the <b>Check rules</b> panel in the Ingredient rules tab. Common causes: Min greater than Max; Min above the material's Max % in Raw materials or the Knowledge Centre inclusion limit; the material is unticked on the Formulation page; the total of all minimums exceeds 100%; or the nutrient targets cannot be met inside that range (e.g. not enough protein when corn is forced high). Loosen the range or switch rules Off one by one to find the cause.</p></details>
<details><summary>The steam calculator shows a warning.</summary><p>Read the message: pressure too low for the target temperature, moisture outside the reference range, or machine steam differs from the calculated value.</p></details>`}},

{id:'faq',t:{id:'FAQ',en:'FAQ'},b:{
id:`<details><summary>Apakah FFMI memerlukan internet?</summary><p>Versi web perlu internet saat pertama dibuka, sesudahnya dapat offline. File unduhan sepenuhnya offline dan tidak pernah memerlukan internet.</p></details>
<details><summary>Apakah data saya dikirim ke internet?</summary><p>Tidak. Semua data tersimpan di browser perangkat Anda. Internet hanya dipakai untuk memuat versi web dan mengunduh update.</p></details>
<details><summary>Kenapa Premium hanya offline?</summary><p>Agar data formula, harga, dan mesin yang sensitif hanya berada di perangkat Anda dan tidak terkait dengan alamat web publik.</p></details>
<details><summary>Bagaimana mendapatkan kode Premium?</summary><p>Hubungi Megay Studio: <a href="https://wa.me/6281915968790" target="_blank" rel="noopener">WhatsApp 0819 1596 8790</a> atau <a href="mailto:megi.hidayatullah@gmail.com">megi.hidayatullah@gmail.com</a>.</p></details>
<details><summary>Bisa dipakai beberapa orang?</summary><p>FFMI dirancang untuk satu pengguna. Beberapa orang di satu perangkat sebaiknya memakai profil browser berbeda.</p></details>
<details><summary>Bagaimana memindahkan data ke perangkat lain?</summary><p>Backup di perangkat lama, lalu Restore di perangkat baru (Premium; gunakan file unduhan di kedua perangkat).</p></details>
<details><summary>Apakah formula siap diproduksi?</summary><p>Hasil adalah estimasi. Validasi dengan ahli nutrisi dan uji produksi.</p></details>
<details><summary>Apakah nilai bahan bawaan akurat?</summary><p>Itu nilai contoh. Ganti dengan data lab dan harga aktual Anda.</p></details>
<details><summary>Mengapa biaya manufaktur lebih tinggi daripada biaya bahan baku?</summary><p>Karena ditambah energi, steam, biaya lain mesin, dan biaya tetap.</p></details>
<details><summary>Apa itu skor pelet?</summary><p>Indikator relatif 0 sampai 100 kemudahan bahan/formula dipelet; bukan pengukuran laboratorium.</p></details>
<details><summary>Mengapa retensi kondisioner memengaruhi formula?</summary><p>Retensi memengaruhi gelatinisasi dan kualitas pellet. FFMI menambahkannya ke skor pelet efektif sehingga formula menyesuaikan kondisi mesin.</p></details>
<details><summary>Apakah Knowledge Centre bisa diubah?</summary><p>Tidak, bersifat permanen. Tambahkan pengetahuan Anda di Knowledge saya.</p></details>
<details><summary>Mengapa Demo tidak bisa menambah bahan?</summary><p>Batas Demo; database bawaan sudah penuh. Edit bahan yang ada, atau gunakan Premium.</p></details>
<details><summary>Bagaimana menambah spesies lain?</summary><p>Versi ini mencakup 5 spesies. Hubungi Megay Studio untuk permintaan pengembangan.</p></details>
<details><summary>Bisa impor formula dari software lain?</summary><p>Tidak. Data dimasukkan manual, atau lewat impor dokumen untuk knowledge (Premium).</p></details>
<details><summary>Bagaimana melaporkan masalah?</summary><p>Hubungi Megay Studio (kontak di bagian Informasi lain). Sertakan nomor versi dan mode (lihat header), langkah yang Anda lakukan, dan tangkapan layar.</p></details>
<details><summary>Bagaimana jika bahan baku tertentu sedang tidak tersedia?</summary><p>Di halaman Formulasi, hilangkan centang bahan itu pada kartu Bahan baku yang digunakan, lalu Hitung formula. Bahan tidak dihapus dari database dan pilihan tersimpan sampai Anda ubah.</p></details>
<details><summary>Apakah kondisi iklim mengubah formula secara otomatis?</summary><p>Hanya untuk broiler/layer pada Kemarau/panas dan bila kotak penyesuaian dicentang (ME min +2%, Lys dan Met min +3%, serat maks ×0,85; layer: Ca min +0,2). Kondisi lain menambah catatan Knowledge Centre; pada Penghujan, saran proses memakai asumsi kadar air bahan 14%.</p></details>
<details><summary>Apa bedanya tekanan steam dan suhu steam?</summary><p>Suhu steam jenuh ditentukan tekanannya (tabel di Modul 5), tetapi suhu mash ditentukan jumlah steam yang masuk. Atur kg steam per ton, bukan hanya tekanan.</p></details>
<details><summary>Bagaimana membatasi jagung minimal 40% dan maksimal 60%?</summary><p>Di tab Aturan bahan tekan + Tambah, pilih Tipe <i>A min–maks % (bahan tunggal)</i>, pilih Jagung pada A, isi v / Min % = 40 dan Maks % = 60. Satu baris sudah cukup (hemat kuota Demo).</p></details>
<details><summary>Bisakah aturan bahan dibuat per spesies?</summary><p>Bisa, lewat kolom Berlaku untuk. Buat aturan terpisah bila batas tiap spesies berbeda.</p></details>`,
en:`<details><summary>Does FFMI need internet?</summary><p>The web version needs internet on first open, then can work offline. The downloaded file is fully offline and never needs internet.</p></details>
<details><summary>Is my data sent to the internet?</summary><p>No. All data is stored in your device's browser. The internet is only used to load the web version and download updates.</p></details>
<details><summary>Why is Premium offline only?</summary><p>So sensitive formula, price and machine data stays on your device and is not tied to a public web address.</p></details>
<details><summary>How do I get a Premium code?</summary><p>Contact Megay Studio: <a href="https://wa.me/6281915968790" target="_blank" rel="noopener">WhatsApp 0819 1596 8790</a> or <a href="mailto:megi.hidayatullah@gmail.com">megi.hidayatullah@gmail.com</a>.</p></details>
<details><summary>Can several people use it?</summary><p>FFMI is designed for one user. Several people on one device should use different browser profiles.</p></details>
<details><summary>How do I move data to another device?</summary><p>Back up on the old device, then Restore on the new one (Premium; use the downloaded file on both).</p></details>
<details><summary>Is a formula ready for production?</summary><p>Results are estimates. Validate with a nutritionist and production trials.</p></details>
<details><summary>Are the built-in material values accurate?</summary><p>They are samples. Replace them with your lab data and actual prices.</p></details>
<details><summary>Why is manufacturing cost higher than raw material cost?</summary><p>Because energy, steam, other machine cost and fixed costs are added.</p></details>
<details><summary>What is the pellet score?</summary><p>A relative 0 to 100 indicator of how easily a material/formula pellets; not a laboratory measurement.</p></details>
<details><summary>Why does conditioning retention affect the formula?</summary><p>Retention affects gelatinisation and pellet quality. FFMI adds it to the effective pellet score so the formula adapts to your machine.</p></details>
<details><summary>Can the Knowledge Centre be edited?</summary><p>No, it is permanent. Add your own knowledge in My knowledge.</p></details>
<details><summary>Why can't Demo add materials?</summary><p>It is a Demo limit; the built-in database is already full. Edit the existing materials, or use Premium.</p></details>
<details><summary>How do I add other species?</summary><p>This version covers 5 species. Contact Megay Studio with development requests.</p></details>
<details><summary>Can I import formulas from other software?</summary><p>No. Data is entered manually, or via document import for knowledge (Premium).</p></details>
<details><summary>How do I report a problem?</summary><p>Contact Megay Studio (contact in Other information). Include the version number and mode (see the header), the steps you took, and a screenshot.</p></details>
<details><summary>What if a particular raw material is unavailable?</summary><p>On the Formulation page, untick that material on the Raw materials to use card, then Generate. The material is not deleted from the database and your selection is kept until you change it.</p></details>
<details><summary>Does the climate condition change the formula automatically?</summary><p>Only for broiler/layer in Dry/hot conditions when the adjustment box is ticked (ME min +2%, Lys and Met min +3%, fiber max ×0.85; layer: Ca min +0.2). Other conditions add Knowledge Centre notes; in Rainy conditions the process guidance assumes 14% material moisture.</p></details>
<details><summary>What is the difference between steam pressure and steam temperature?</summary><p>Saturated steam temperature is set by its pressure (table in Module 5), but mash temperature is set by the amount of steam added. Control kg of steam per tonne, not only pressure.</p></details>
<details><summary>How do I limit corn to at least 40% and at most 60%?</summary><p>In the Ingredient rules tab press + Add, choose Type <i>A min–max % (single material)</i>, select Corn in A, enter v / Min % = 40 and Max % = 60. One row is enough (saves Demo quota).</p></details>
<details><summary>Can ingredient rules be made per species?</summary><p>Yes, through the Applies to column. Create separate rules when limits differ per species.</p></details>`}},

<td>Ton per jam</td></tr></table></div>
